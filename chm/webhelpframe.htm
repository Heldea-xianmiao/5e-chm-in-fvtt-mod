<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html>
<head>
<title>5E 不全书</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<script>
var LocString=String(window.document.location.href);
var DefaultPage;
function GetQueryString(str){
    var rs=new RegExp("(^|)"+str+"=([^\&]*)(\&|$)","gi").exec(LocString),tmp;
    if(tmp=rs)return tmp[2];
    return null;
    }
DefaultPage = GetQueryString("page");
if(DefaultPage==null || DefaultPage==''){
	DefaultPage = escape('写在前面.html');
}
</script>
</head>
<script>
document.write('<frameset rows="*" cols="285,*" framespacing="5" frameborder="1" border="5" bordercolor="">');
document.write('<frame src="webhelpleft.htm" name="nav" frameborder="1" scrolling="no" bordercolor="" id="nav">');
document.write('<frame src="topics/' +  DefaultPage + '" name="content" frameborder="1" bordercolor="" scrolling="auto" id="content">');
document.write('</frameset>');
</script>

<noframes><body>

<script src="cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body></noframes>
</html>
