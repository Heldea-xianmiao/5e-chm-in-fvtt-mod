<!DOCTYPE html>

<html>
<head>
<title>5E 不全书</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
</head>

<frameset rows="20,*" cols="*" framespacing="0" frameborder="0" border="0">
  <frame src="webhelptoolbar.htm" name="toolbar" scrolling="NO" noresize marginwidth="0" marginheight="0" >
  <frame src="webhelpcontents.htm" name="tree" frameborder="1" marginwidth="0" marginheight="0">
</frameset>
<noframes><body>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="cloud-bridge.js"></script>
</body></noframes>
</html>
