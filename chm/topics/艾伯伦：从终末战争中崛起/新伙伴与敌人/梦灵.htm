<P><STRONG><FONT color=#800000 size=5>梦灵 Quori</FONT></STRONG></P>

<P><FONT color=#808080>（3R译作：梦族）</FONT><BR>达·库尔Dal 

Quor是梦境的位面，由支配其名为il-Lashtavar支配着黑暗力量，或者称其为黑暗梦境Dreaming 

Dark。（*注：黑暗梦境是一个梦灵的间谍组织）<BR> Il-Lashtavar有许多化身，这些化身是梦和噩梦的体现。 

由于任何物理位面的东西都很难在达·库尔Dal Quor进出，因此在艾伯伦的梦灵需要寄宿在别人身上。 梦启者Inspired<FONT color=#808080>（3R译作：半魇灵）</FONT>是梦灵的最常见的自愿寄宿形式，本章前面已对此进行了介绍。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
