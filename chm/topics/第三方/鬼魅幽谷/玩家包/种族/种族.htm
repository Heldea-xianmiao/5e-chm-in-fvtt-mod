<H1>种族 Species</H1>

<P>大部分标准的幻想种族都在艾弗瑞斯世界中有一席之地：人类、精灵、矮人和半身人都在喧嚣动荡中尽力生存。

<BR>但还有一些物种是艾弗瑞斯独有的。有些是残忍妖精的恶意玩笑，而另一些则源自奥术之灾。他们与其他凡人种族一起奋斗遭难——但他们的存在也同样彰显艾弗瑞斯的奇迹与危机，这一切使得艾弗瑞斯独一无二。</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
