<body>

<H1>子职 Subclasses</H1>

<P>艾弗瑞斯世界中的角色深受黑暗力量甚至恶意力量的影响，这让他们在其他人或许避之不及的领域深造。<BR>这些子职反映了这些英雄所生活和战斗的世界。在神明的指引缺失的情况下，信徒们只得依靠大天使坚定的言语。而战士们为在王国的怪物手下生存，锻炼出暴力的武术技巧。<BR>当你游玩这些子职时，想想你身上的恶意力量如何影响你的角色的心理。还要考虑一般民众与你互动时的反应。你的力量可以激发希望吗？还是让你变得如同普通人所害怕的怪物一样恐怖？</P>

<P> </P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
