<H3>枪械弹药 Firearm Ammunition</H3>





<P>具有弹药词条的武器需要弹药。武器描述会指定其使用的弹药类型。以下弹药表列出了枪械使用的新弹药类型以及购买时可获得的数量。</P>





<P>枪械弹药被使用后即摧毁。</P>



<table class=center>

<TR><TH width=160>类型</TH><TH width=80>数量</TH><TH width=80>重量</TH><TH width=80>花费</TH></TR>

<TR bgcolor=#eeeeee><TD>射弹Shot</TD><TD>10</TD><TD>2磅</TD><TD>1GP</TD></TR>

<TR><TD>子弹Bullets</TD><TD>10</TD><TD>1.5磅</TD><TD>3GP</TD></TR>

<TR bgcolor=#eeeeee><TD>霰弹Shells</TD><TD>10</TD><TD>1.5磅</TD><TD>5GP</TD></TR>

<TR><TD>信号弹Flares</TD><TD>5</TD><TD>5磅</TD><TD>5GP</TD></TR>

<TR bgcolor=#eeeeee><TD>加农炮弹Cannonballs</TD><TD>5</TD><TD>10磅</TD><TD>25GP</TD></TR>



</table>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
