<html>

<body>



<H2>武器词条 Weapon Properties</H2>



<P>以下是枪械表中词条列中各词条的定义，此处仅列出本书新增或有改动的词条。</P>



<P><STRONG><FONT color=#800000>枪械 

Firearm</FONT></STRONG><BR> 除非另有说明，否则你无法将你的属性调整值添加到武器的伤害中。枪械的弹药在使用后即摧毁。</P>



<P><STRONG><FONT color=#800000>后坐 

Recoil</FONT></STRONG><BR>在你使用此武器发动攻击后，直至当前回合结束，你都无法发动超出武器常规射程的远程攻击。</P>



<P><STRONG><FONT color=#800000>换弹&nbsp;Reload<BR></FONT></STRONG>此武器在必须换弹前可以进行一定次数的攻击。如果你熟练于此武器，则为其换弹为一个动作或附赠动作；否则，换弹为一个动作。</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
