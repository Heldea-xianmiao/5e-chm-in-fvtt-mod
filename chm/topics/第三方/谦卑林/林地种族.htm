<P><STRONG><FONT color=#800000 size=5>林地种族 Races of the Wood</FONT></STRONG></P>

<P>组成谦卑林世界的各族裔分为两类：禽鸟族裔和谦卑族裔。尽管它们很像动物，但这些居住在谦卑林的城市和乡镇的族裔都属于类人生物。<BR>本章概述了10个核心种族，5个禽鸟族裔和5个谦卑族裔，他们构成了在森林中发现的大多数角色。本章还详细介绍了各种角色创建选项、新职业选项、背景、专长和法术，以帮助您制作自己的谦卑林冒险家。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
