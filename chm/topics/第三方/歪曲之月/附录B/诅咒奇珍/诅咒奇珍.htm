<H2>诅咒奇珍 Cursed Curios</H2>

<P>某些魔法物品带有一种诅咒，会渗入肉体、心智或灵魂，并且同调时间越长，诅咒侵蚀越深。在德鲁斯肯瓦尔德，力量永远伴随着代价和危险，然而一旦你掌握了力量，你还有勇气放弃它吗？<BR><STRONG>缠魂诅咒Lingering 

Curses。</STRONG> 

 

结束与这些物品的同调会移除其诅咒，但诅咒异宝的力量不会轻易放开对使用者的控制。如果你在28日内再次与该物品同调，则其带来的诅咒会恢复至你结束同调之前的程度。</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../../cloud-bridge.js"></script>
