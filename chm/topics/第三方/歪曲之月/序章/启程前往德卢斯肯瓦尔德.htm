<H2>启程前往德鲁斯肯瓦尔德 Onward to Druskenvald</H2>

<P>如今，你已准备好乘坐幽灯特快列车，穿越幽幕，直面德鲁斯肯瓦尔德中潜伏的恐怖。本书中的内容从未意图成为绝对的规范，我们鼓励你按照最适合你们桌的方式来加以运用。以《<FONT face=仿宋><STRONG>歪曲之月</STRONG></FONT>》为指引，你已准备充足，能与朋友们共同打造出一场难以忘怀、萦绕于心的民俗恐怖故事。</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>
