<H6>
林巫园艺杖 Hedgewitch's Gardening Cane
</H6><P><EM>
法杖，普通
<BR></EM>
这根木质手杖两端各有一朵银花装饰，手柄处的银花盛开绽放，而底端的银花则是含苞待放。持握手杖期间，你可以用一个动作将其轻触地面，并在心中下达命令，使手杖的底端魔法般地变化为扫帚、锄头、耙子、铲子，或变回普通手杖。
</P>
<H6>
坚毅手杖 Stalwart Staff
</H6><P><EM>
法杖，普通
<BR></EM>
这根精雕细琢的法杖是一根配有一个包裹着磨损皮革的握柄的步行手杖，它能让你获得更好的耐力。如果你在步行旅行期间将此法杖作为步行手杖使用，你在进行第一次强行军的豁免检定时具有优势。
</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
