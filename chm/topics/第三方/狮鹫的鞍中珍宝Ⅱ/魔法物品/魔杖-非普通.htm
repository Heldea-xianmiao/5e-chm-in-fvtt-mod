<body>

<H6>

探测魔杖 Wand of Dowsing

</H6><P><EM>

魔杖，非普通（需同调）

<BR></EM>

这根榛木魔杖有3发充能。持握此魔杖期间，你可以使用一个动作消耗其1充能，来从中施展物件定位术LocateObject。当被用于寻找水源时，它的作用范围增加10里。<br>

该魔杖在每日黎明时恢复1d3已消耗的充能。当充能耗尽时，骰一次d20。如果骰值为1，则魔杖会爆发成一小团无害的蒸汽。

</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
