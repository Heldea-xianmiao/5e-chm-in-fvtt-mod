<H6>

刺客之王之戒 Ring of the Assassin Lord

</H6><P><EM>

戒指，传说（需游荡者同调）

<BR></EM>

这枚匕首造型的戒指曾被历史上多位著名刺客佩戴。佩戴此戒指期间，你每回合可额外造成两次偷袭的伤害，而非一次。两次攻击须针对不同目标，且第二次攻击的偷袭伤害减半。<br>

戒指内侧在初次同调时是空白无痕的。每当你通过附加偷袭伤害的攻击将一名挑战等级为1或以上的生物的生命值降至0时，戒指内侧便会浮现出一道刻痕。一旦刻痕达50道，你的敏捷属性值及其上限均提升2点，此后戒指不再新增刻痕。若其他生物同调此戒并获得该加值，你的敏捷属性值及其上限将恢复原状。

</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
