<html>

<head>

<title>胧忆岛族裔</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../../style.css">



</head>



<body>

<H1>胧忆岛族裔 Ancestries of Obojima</H1>

<P>胧忆岛上生存的族裔包括人类、达良、精灵和鸣玉族。这个世界的文化和历史就是围绕着这些族裔建立的。如果你想要完全沉浸在胧忆岛的体验中,你可能会想要从这些族裔中选择一个。<BR>这并不是说你不能扮演其他族裔。只是这意味着你需要以自己独特的方式将它们引入到这座岛屿中。关于如何改编现有的5E族裔,请参见其他族裔章节（翻译暂缺）。</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
