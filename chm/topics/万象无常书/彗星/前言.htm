<h1><IMG alt="" src="../pic/comet.jpg" align=right height=600 >第十二章：彗星Comet</h1>

<p>末日临近！<BR>本章详细介绍了彗星先驱，一个致力于依靠最初的万象无常牌来终结一切的末日教派。本章讲述了教派的主要首领、成员及其分工，并展示了其中一个据点的地图。本章末尾还介绍了与世界末日有关的天象、征兆和预言，并讲述了如何在团里使用这些内容。本章是为DM设计的，不过角色也可能成为这一邪教的编外成员，或者与其建立伙伴关系。</p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
