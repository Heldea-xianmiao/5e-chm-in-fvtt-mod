<body><h1><IMG alt="" src="../pic/throne.jpg" align=right height=600 >第十五章：王座 Throne 

</h1><p>

从万象无常牌中抽出王座牌的角色将会获得一处城堡的所有权。但这处城堡有多大？有着怎么样的防御和布局？现在里头住着什么，角色们又必须做什么才能保住它？这一章为DM准备，其中介绍了苦难厅——一处被邪恶的死灵法师占据的城堡，作为一个范例。不是必须要你的游戏中出现了王座牌，苦难厅才派的上用场。探索这座闹鬼的城堡本身就是一次优秀的单次冒险，尤其是对需要在冒险和冒险之间稍作休息的角色们来说。</p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
