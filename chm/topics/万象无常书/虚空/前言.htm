<body><h1><IMG alt="" src="../pic/void.jpg" align=right height=600 >第十八章：虚空 Void</h1><p><strong>虚空Void</strong>牌也许是<EM><U>万象无常牌 Deck of Many 

Things</U></EM>  

  

当中最可怕的一抽。抽到这张牌的人将面临可怕的命运：他们的身体倒下而灵魂被囚禁在遥远的物件中。这给DM、队伍和被囚禁角色的玩家带来了挑战。灵魂被带到哪里去了？队友要如何追回它？当角色无法行动时，角色的玩家该怎么办？<br>

本章介绍了纸牌屋，一个在有人抽到<strong>虚空Void</strong>牌时才出现的遥远半位面中的地下城。被囚禁角色的灵魂在这里被用作诱饵，引诱其他角色进入凶猛怪物的巢穴。本章的开头是在一个角色与其他人分开时，给DM和面临挑战的玩家的建议。这种情况可以通过多种方式处理，DM可以选择适合其玩家和战役的那种。</p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
