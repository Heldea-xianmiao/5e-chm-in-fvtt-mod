<h1>

<IMG alt="" src="../pic/rogue.jpg" align=right height=600 > 第六章：浪客 Rogue</h1>



<P><FONT color=#808080 size=2>（译注：该卡卡名同样也是<STRONG>游荡者Rogue</STRONG>。）</FONT></P>

<p>这张浪客牌代表着背叛和隐藏的威胁。本章节包含了一些朝着狡猾、技能和多才多艺为重点的角色的魔法牌组，以及受到浪客牌灵感启发的角色创造思路。接下来，本章节提供了工具和建议来裁决“当你抽到浪客牌时”也许会发生的事，包括在故事中悍然出现的反派角色，以及有关他们的动机的一些建议。当然~在浪客之厅中还有这些敌对生物的资料卡哦~</p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
