</p><p>

如果要完整且详细的介绍整座荒废的修道院就需要太多笔墨了。代替的，这里将呈现一组各个区域的环境概要与任何能在这里找到的东西。使用列出的怪物在加上你认为合适的怪物，你可以根据你团角色们的行动来创建对应的遭遇表。以下会提供两份地图：地图16.1，一张荒废修道院的总览，以及地图16.2，一张山顶上梅克卡拉斯巢穴的详细版地图。</p><p align=center><IMG src="https://picdl.sunbangyan.cn/2024/01/02/2a93c6cc6b4644e3520ee4c71bd14bfe.jpeg" width=600 ><br>地图16.1 

伽德摩尔修道院的废墟群</p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
