<body>

<P> </P>

<div style="BORDER-TOP: black 1px solid; FONT-FAMILY: 仿宋; BORDER-RIGHT: black 1px solid;BACKGROUND: #a3e6f9; BORDER-BOTTOM: black 1px solid; PADDING-BOTTOM: 10px; TEXT-ALIGN: center; PADDING-TOP: 20px; PADDING-LEFT: 50px;MARGIN-LEFT: 50px; MARGIN-RIGHT: 50px;BORDER-LEFT: black 1px solid; PADDING-RIGHT: 50px">带署名说话模板<br><span style="MARGIN-TOP: 10px; FLOAT: right">——阿斯忒瑞亚</span></div>

<P> </P>

<P> </P>

<div style="BORDER-TOP: black 1px solid; FONT-FAMILY: 仿宋; BORDER-RIGHT: black 1px solid;BACKGROUND: #a3e6f9; BORDER-BOTTOM: black 1px solid; PADDING-BOTTOM: 20px; TEXT-ALIGN: center; PADDING-TOP: 20px; PADDING-LEFT: 50px;MARGIN-LEFT: 50px; MARGIN-RIGHT: 50px;BORDER-LEFT: black 1px solid; PADDING-RIGHT: 50px">不带署名说话模板</div>

<P> </P>

<P> </P>

<div style="BORDER-TOP: black 1px solid; BORDER-RIGHT: black 1px solid;BACKGROUND: #eeeeee; BORDER-BOTTOM: black 1px solid; PADDING-BOTTOM: 20px; PADDING-TOP: 20px; PADDING-LEFT: 50px;MARGIN-LEFT: 50px; MARGIN-RIGHT: 50px;BORDER-LEFT: black 1px solid; PADDING-RIGHT: 50px">迷题之类的用的框</div><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../cloud-bridge.js"></script>
</body>

</html>
