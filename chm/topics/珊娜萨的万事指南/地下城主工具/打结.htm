<P><STRONG><FONT color=#800000 size=5>打结 Tying Knots</FONT></STRONG></P>
<P>像打结这类琐碎的小事原本没必要专门制定一套规则。但有时为了营造戏剧性的效果，当某人试图解开一或挣脱一个绳结时，我们需要知道这个结是否足够复杂。这里有一个可选规则来确定绳结的有效性。</P>
<P>当某人打结时，进行一次智力（巧手）检定，以检定最终结果作为DC。试图解开这个结须通过一次智力（巧手）检定，而想要挣脱这个结则须通过一次敏捷（杂技）检定。<BR>这一规则故意将巧手技能与智力属性搭配，而不是通常的敏捷。这是一个应用《玩家手册》第七章中“变体：技能搭配其他属性Variant: 
Skills with Different Abilities”规则的例子。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
