<!-- coding: gbk --><!DOCTYPE html>

<html>

<head>

<title>范例休整期活动</title>

<meta name="GENERATOR" content="WinCHM">

html,body { 

	font-family: Arial, Helvetica, sans-serif;

<body>

<P><STRONG><FONT color=#800000 size=5>范例休整期活动 Example Downtime Activities</FONT></STRONG></P>

<P>任何角色都可以进行下列活动只要他们足以负担。作为DM，你有权力最终决定角色们可以使用哪些活动。你允许的活动可能取决于角色所在区域的性质。例如，你可能会禁止创造魔法物品，因为角色的所在位置太偏僻而难以购买这些商品。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
