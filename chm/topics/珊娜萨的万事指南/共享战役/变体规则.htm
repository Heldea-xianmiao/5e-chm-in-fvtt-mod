<P><STRONG><FONT color=#800000 size=5>变体规则 Variant Rules  </FONT></STRONG> 

</P>

<P>一场共享战役也许会用到一些变体规则来处理游戏的部分方面。作为共享战役的实例，<STRONG>冒险者联盟Adventurers 

League</STRONG> 

拥有着一套获取等级和持有/获取宝藏的变体系统。以下展示的这些“房规”，是以常规语言写明的、确保了不论每个角色经历何种的冒险，都能平等的获取奖励的规则。</P>

<P><FONT color=#808080>（译注：此处的房规原文为 house rules 而非 homebrew 

，我也不知道有什么区别，但总之可能想说这是官方一点的跑团店的 House ，而非几个玩家凑起来今天来你家用的 Home 

吧。）</FONT>          

            

          

             

            

 </P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
