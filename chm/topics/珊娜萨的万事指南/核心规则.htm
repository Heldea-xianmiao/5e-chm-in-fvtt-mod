<P>本书基于三本核心规则书的规则。游戏会频繁用到《玩家手册》第7~10章的规则，包括：“属性值应用”“冒险”“战斗”“施法”，以及其附录A中包括的隐形和倒地等重要状态。你不需要死记这些规则，不过最好能在需要它们时知道要到哪里去查询。</P>

<P> 

如果你是DM，你还要知道如何在《城主指南》中查找相应的内容，特别是一些魔法物品的运作方式（见该书第七章）。关于如何阅读怪物资料板的指引可以参见《怪物图鉴》的简介</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
