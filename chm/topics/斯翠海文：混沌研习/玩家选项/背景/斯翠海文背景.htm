<html>
<head>
<title>斯翠海文背景</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
html,body { 
	font-family: Arial, Helvetica, sans-serif;
}
</style>

</head>

<body>
<P><STRONG><FONT color=#800000 size=5>斯翠海文背景Strixhaven Backgrounds</FONT></STRONG></P>
<P>本节提供 5 
个背景选项，选择这些背景，用以反映你的角色为进入斯翠海文特定学院所做的学习准备。在斯翠海文战役中你能选择的背景不受限于这 5 
个；这些背景只是你能选择的一种方式，表示你的角色深入了解其所属的学院。<BR>如果你选择了一项其中的背景，你可以认为到现在这个节点之前，你的人生都在学习，为能入学斯翠海文做准备，你可能对除了预备功课之外的世界都不太了解。你做好胜任学生这个身份的准备了，作为回报，这也会让你驰骋毕业之后踏上的任何道途。</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
