<P><STRONG><FONT color=#800000 size=5>使用这些规则 Using These Rules</FONT></STRONG></P>

<P>本书中的冒险也包括了社交遭遇，也就是角色可以和其他学生 NPC 们（相应的 NPC 

将在下文“同学”章节提到）进行互动的事件。当这样的遭遇开始时，可以使用本书的冒险中提到的朗读文本来描述这个场景，然后让角色们逐一和学生 NPC 

进行互动。<BR>每个和学生 NPC 在社交遭遇中进行了互动的玩家角色，都可以获得一个或更多的和该 NPC 之间的关系点数。<BR>和特定 NPC 

之间的关系点数量决定了玩家角色和该 NPC的关系。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
