<title>退出课外社团</title>

<meta name="GENERATOR" content="WinCHM">

	font-family: Arial, Helvetica, sans-serif;

<body>

<P><STRONG><FONT color=#800000 size=5>退出课外社团 Quitting an Extracurricular</FONT></STRONG></P>

<P>角色可以随时退出课外社团，并相应地更新其记录表。<BR>当一个学生退出课外社团时，他们即刻失去由该课外社团带来的增益。如果一个角色在冒险中途退出了课外社团，你们或许需要对该场景进行角色扮演，因为课外社团中的 

NPC 可能疑惑这个学生为什么要离开。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
