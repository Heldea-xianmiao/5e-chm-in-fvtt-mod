<P><STRONG><FONT color=#800000 size=5>结交朋友和对手 Making Friends and Rivals</FONT></STRONG></P>
<P>当一个角色和一个学生 NPC 之间拥有 2 点或以上的关系点数时，该 NPC 
就此成为了角色的朋友，在双方保持友谊的期间，此角色可以获得一个来自该 NPC 的羁绊之福（Bond Boon）。<BR>当一个角色和学生 NPC 
直接的关系点数为-2 或者更低时，该 NPC 成为了他的对手，在双方保持对抗的期间，该角色获得一个来自该 NPC 的羁绊之祸（Bond 
Bane）。<BR>每个角色的羁绊之福/祸都标注在后面“同学”章节的 NPC 
介绍里。当一个角色结交朋友或者和人成为对手时，玩家应当记录下这个发展。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
