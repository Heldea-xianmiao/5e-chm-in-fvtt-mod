<P><STRONG><FONT color=#800000 size=5>坠落至生物上 Falling onto a Creature</FONT></STRONG></P>

<P>如果一个生物坠落至另一个生物所占据的空间里，而它们都非微型体型，后者必须在一次DC 

15的敏捷豁免中成功，否则被坠落的生物撞击，并且由于坠落而造成的任何伤害在它们之间平均分配。</P>

<P> 

受到撞击的生物也应击倒地，除非它的体型比坠落的生物大两级或者两级以上。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
