<html>

<head>

<title>落水</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body>

<P><STRONG><FONT color=#800000 size=5>落水 Falling into Water</FONT></STRONG></P>

<P>一个生物在落入水中或其他液体中时，可以使用其反应进行一次DC 

15的力量（运动）或敏捷（特技）检定，来让头或脚先入水。若检定成功，任何由坠落造成的伤害都会减半。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
