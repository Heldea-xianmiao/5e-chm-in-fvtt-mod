<P><STRONG><FONT color=#800000 size=5>灰鹰 Greyhawk</FONT></STRONG></P>

<P>灰鹰是一个你可以用作你战役背景的 D&amp;D 

世设，你也能将它作为创造自己世设时使用的模版。为了方便你自行使用，这一部分讲述了关于灰鹰的重要内容，你可以随心所欲地修改和扩展它们。</P>

<P>灰鹰是加里·盖克斯， D&amp;D 游戏最初创造者之一的作品。加里在这个自创的世设中创作了许多 D&amp;D 

早期冒险。本书中的这一版灰鹰则很大程度上脱胎于在 1980 年出版的《灰鹰世界地理志》。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
