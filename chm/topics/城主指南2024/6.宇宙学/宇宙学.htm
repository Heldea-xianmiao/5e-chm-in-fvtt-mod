<H1>第六章 ： 宇宙学 Cosmology</H1>
<P>D&amp;D诸世界坐落于无边宇宙之中。大多数战役和冒险都发生于物质位面的诸世界上。多元宇宙的其余部分包括诸多存在位面，而它们因其与物质位面之间的相对位置得名。<BR>存在位面奇异而危险，其中艰险困境绝非自然世界可比。冒险者们可以在烈焰街道上漫步，在每逢黎明所有死者都会复活的战场上挑战自己的毅力，或者在多元宇宙中心的环形城市中，仰望痛苦女士悬浮于街道之上的壮丽景象。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
