<body>

<H6>变形魔杖 Wand of Polymorph</H6>

<P><EM>魔杖，极珍稀（需施法者同调）</EM><BR>这根魔杖具有7充能。持握它时，你可以消耗1充能从中施展<U><I>变形术Polymorph</I></U>（豁免DC15）。<BR><STRONG>重获充能Regaining 

Charges</STRONG> 

。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
