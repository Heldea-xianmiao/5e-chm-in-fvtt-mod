<!DOCTYPE html>
<!-- coding: gbk -->
<html>
<head>
<title>魔法物品详述</title>

<meta content="text/html; charset=UTF-8">
<link rel="stylesheet" href="../../../style.css">

</head>

<body>
<P><STRONG><FONT color=#800000 size=5>魔法物品详述</FONT></STRONG></P>
<P>魔法物品按字母顺序排列。如果一个魔法物品的描述将一个生物的名字大写并以粗体显示，这是一个指向该生物资料卡的视觉提示。除非文本另有说明，否则该资料卡在《<STRONG><FONT face=仿宋>怪物图鉴</FONT>》</STRONG>中。如何阅读和使用资料卡在《<STRONG><FONT face=仿宋>怪物图鉴</FONT>》</STRONG>中有解释，在玩家手册中也有少量解释。</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
