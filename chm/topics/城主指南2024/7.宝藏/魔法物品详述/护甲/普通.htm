<html>

<head>

<title>普通</title>



<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../../../style.css">



</head>



<body>

<H6>闪烁甲 Armor of Gleaming</H6>

<P><EM>护甲（任意轻甲、中甲或重甲）普通<BR></EM>这件护甲永远不会脏。</P>

<H6>速脱甲 Cast-Off Armor</H6>

<P><EM>护甲（任意轻甲、中甲或重甲），普通</EM><BR>你只用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作便可脱下这套护甲。</P>

<H6>表情盾 Shield of Expression</H6>

<P><EM>护甲（盾牌），普通<BR></EM>这面盾牌的正面呈现出一张脸的形状。携带这面盾牌期间，你可以使用一个<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>来改变这张脸的表情。</P>

<H6>焖燃护甲 Smoldering Armor</H6>

<P><EM>护甲（任意重甲，中甲或轻甲），普通<BR></EM>这件护甲被着装期间，一缕缕无害无味的烟雾会不断从护甲中升起。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
