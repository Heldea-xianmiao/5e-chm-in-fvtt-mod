<body>
<H3>冒险背景 Adventure Premise</H3>
<P>
你可以想象一个可能会引起角色们兴趣的情况，藉此来开展你对冒险的思考。对于一些d&amp;d玩家来说，一个充满宝藏的地城传闻就足以成为他们开始冒险的动机。两个小国之间正在发酵的战争，领导人的去世和新领袖的上任，某些危险怪物的迁徙，一颗彗星的突然出现，以及通往另一位面的传送门的开启，都是一些可能导致冒险产生的情景。
<BR>“角色们想要的魔法物品就藏在地城里”亦可以是一个简单的冒险背景。浏览第七章中所述的魔法物品，它们可以启发你去创作一个简单的冒险开端。
</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
