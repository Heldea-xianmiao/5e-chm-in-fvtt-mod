<P><FONT color=#800000 ><FONT size=5><STRONG>攻击检定 Attack Rolls</STRONG></FONT></FONT></P>

<P>战斗中使用攻击检定来判定一次攻击是否命中。<BR>你也可以使用攻击检定来处理与战斗中的攻击行为相近的非战斗活动，比如一场箭术比试或飞镖游戏。为目标确立护甲等级，决定角色是否具有所使用武器的熟练项，随后让玩家进行一次攻击检定。（又见本章中“成功程度”。）</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
