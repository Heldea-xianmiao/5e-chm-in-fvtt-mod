<H3>龙巫教信徒 Dragon Cultist</H3>
<P><b>属性值：</b>敏捷、体质、智力
<BR><b>专长：</b>新晋龙巫教徒（见本章后文"专长"）
<BR><b>技能熟练：</b>欺瞒与隐匿
<BR><b>工具熟练：</b>书法工具
<BR><b>装备：</b>选择A或B：(A)书法工具、匕首、玻璃瓶、油灯、镣铐、燃油（5瓶）、2个小包、长袍、绳索、30GP；或(B)50GP。</P>
<P> 你是一位新晋龙巫教徒。你了解到或被人带进了某个基层邪教组织，在那里，你彰显着龙巫教徒引以为豪的品质：虚伪狡诈，恪守秘密，以及坚定决心。以你为龙巫教效命的誓言作为交换，龙巫教为你提供了随行的拜龙者为同伴，以及能够助你在奥法及神秘学领域中展开进一步研究的资源。</P>

<script src="../../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
