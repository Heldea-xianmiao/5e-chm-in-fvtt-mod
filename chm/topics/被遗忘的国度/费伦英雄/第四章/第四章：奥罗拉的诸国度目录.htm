<body>
<H1>第四章：奥萝拉的诸国度目录 Aurora’s Whole Realms Catalog</H1>
<div class=center
 align=center style="BACKGROUND-COLOR: #eeeeee"><STRONG><FONT face=仿宋>欢迎来到奥萝拉的诸国度目录！<BR>一个多世纪以前，我的曾祖母创立了这家店，为费伦各地的挑剔客户提供冒险装备和工具。能继续她那传奇般的事业，真是我的荣幸。<BR>你现在看到的，仅是我们遍布诸国度各个城镇与城市的众多商铺中，数百件在售商品的样品。如果你在我们中的某家商铺没找到想要的物品，我们的特别订购服务快速可靠，且提供满意保障。我们甚至送货上门！</FONT></STRONG></div>


<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
