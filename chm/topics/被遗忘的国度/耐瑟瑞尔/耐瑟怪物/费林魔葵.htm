<body>
<H1>费林魔葵 Phaerimm
</H1>

<p class=sum>痴迷于魔法的异形操纵者
</p>

<div class="HT"><STRONG>栖息地：</STRONG>
幽暗地域，城市；<STRONG>宝藏：</STRONG>奥秘，器具
</div>

<P>费林魔葵是试图统治其他智慧物种的邪恶异形，它的锥形身躯于空中波动，拖着一张硕大的扁平嘴巴，嘴巴周围环绕着四条纤细的附肢。费林魔葵嘴后部的身体不断收缩，末端是一根毒刺。只有在魔法手段不起作用时，费林魔葵才会使用这根毒刺。
<BR>远古时期的费林魔葵曾将旧日强盛的耐瑟瑞尔帝国摧毁殆尽。这些费林魔葵被囚禁在广袤的埃诺奥克沙漠之下，如今正密谋重返昔日领地。

</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
