<html><head><title>子职选项</title><meta name="GENERATOR" content="WinCHM"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style>html,body{font-family: Arial, Helvetica, sans-serif;}</style></head>
<body>
<H2 style="MARGIN: 5pt auto"><B><SPAN 
style="FONT-SIZE: 18pt;  FONT-WEIGHT: bold; ;">子职选项 Subclass Options</SPAN></B><B><SPAN 
style="FONT-SIZE: 18pt;  FONT-WEIGHT: bold; ;"><o:p></o:p></SPAN></B></H2>
<P  
style="MARGIN: 0pt; TEXT-INDENT: 21pt; mso-char-indent-count: 2.0000"><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">在</SPAN><SPAN 
style="">3</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">级</SPAN><SPAN 
style="">时</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">，吟游诗人选择吟游诗人学院。在</SPAN><SPAN 
style="">1</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">级</SPAN><SPAN 
style="">时</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">，</SPAN><SPAN 
style="">魔契师</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">选择</SPAN><SPAN 
style="">异界宗主</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">。</SPAN><SPAN 
style="">本小节</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">为吟游诗人提供了精魂学院，为</SPAN><SPAN 
style="">魔契师</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">提供了</SPAN><SPAN 
style="">死灵宗主</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'">，扩展了他们的选择。</SPAN><SPAN 
style="mso-bidi-font-family: 'Times New Roman'"><o:p></o:p></SPAN></P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
