<P  

style="MARGIN: 0pt; TEXT-INDENT: 21pt; mso-char-indent-count: 2.0000"><SPAN 

style="">创造恐怖场景并不完全是优秀故事叙述的结果。作为全书所强调的，任何规则都可以制造恐怖效果，用黑暗的游戏资源来呈现恐怖或是使用新可选规则制造恐怖都可以。本节进一步提供了能让现有规则更突出恐怖主题的可选项和鼓励独特恐怖经历的表现系统。</SPAN><SPAN 

style="mso-bidi-font-family: 'Times New Roman'"><o:p></o:p></SPAN></P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
