<!-- coding: gbk --><!DOCTYPE html>

<html>

<head>

<title>多种稀有度</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body>

<P><STRONG><FONT color=#800000>护甲 

Armor，+1、+2、或+3</FONT></STRONG><BR><EM>护甲（轻甲、中甲、或重甲），珍稀（+1）/极珍稀（+2）/传说（+3）</EM><BR>着装该护甲期间，你的AC获得加值。加值的数值取决于护甲的稀有度。</P>

<P><STRONG><FONT color=#800000>盾牌 

Shield，+1、+2、或+3</FONT></STRONG><BR><EM>护甲（盾牌），非普通（+1）/珍稀（+2）/极珍稀（+3）<BR></EM>持握此盾牌期间，你的AC获得额外的加值。加值的数值取决于该盾牌的稀有度。<BR>这一AC加值会被算入盾牌正常情况下为你提供的AC值中。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../../cloud-bridge.js"></script>
</body>

</html>
