<!-- coding: gbk --><!DOCTYPE html>

<html>

<head>

<title>多种稀有度</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body><FONT color=#800000><STRONG>契约掌控者权杖 Rod of the Pact 

Keeper</STRONG><STRONG>，+1、+2、+3</STRONG>     

</FONT><BR><EM>权杖，非普通（+1）/珍稀（+2）/极珍稀（+3）（需魔契师同调）</EM><BR>持握这把权杖期间，你施展魔契师法术时法术攻击检定与豁免DC获得由权杖稀有度决定的加值。<BR>此外，持握这把权杖期间，你可以用一个动作恢复1枚魔契师法术位。你必须完成一次长休才能再次使用权杖的这个属性。<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
