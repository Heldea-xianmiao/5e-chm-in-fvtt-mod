<html>

<head>

<title>普通</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body><STRONG><FONT color=#800000>攀爬药水 Potion of 

Climbing</FONT></STRONG><BR><EM>药水，普通</EM><BR>饮用此药水后，你获得等同于你步行速度的攀爬速度，持续1小时。在此期间，你为攀爬所做的力量（运动）检定具有优势。药水分离成类似于岩层的褐色、银色、和灰色三层，即使摇晃也无法让三种颜色混合到一起。<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
