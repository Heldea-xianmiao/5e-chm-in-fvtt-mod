<!-- coding: gbk --><!DOCTYPE html>

<html>

<head>

<title>极珍稀</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body><STRONG><FONT color=#800000>位面护符 Amulet of the 

Planes</FONT></STRONG><BR><EM>奇物，极珍稀（需同调）</EM><BR>佩戴此护符期间，你可以用一个动作来点名一处你熟悉的另一存在位面地点，然后进行一次DC 

15的智力检定。如果检定通过，则你施展出法术<EM><FONT color=#800080>位面转移 plane 

shift</FONT></EM> 

  

。如果检定失败，你将和15尺内的每个生物与物件一齐被传送到某个随机地点。骰一次d100。如果骰值为1~60，则你们被传送到你点名位面中的随机地点。如果骰值为61~100，则你们被随机传送到一个存在位面。<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../../cloud-bridge.js"></script>
</body>

</html>
