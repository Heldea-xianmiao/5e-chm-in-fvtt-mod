<title>多种稀有度</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body>

<P><STRONG><FONT color=#800000>弹药 

Ammunition，+1、+2、+3</FONT></STRONG><BR><EM>武器（任何弹药），非普通（+1）/珍稀（+2）/极珍稀（+3）</EM><BR>你使用此魔法弹药发动攻击检定和伤害掷骰时获得加值。加值的数值取决于弹药的稀有度。此弹药一旦击中目标即不再具有魔法效果。</P>

<P><STRONG><FONT color=#800000>武器 

Weapon，+1、+2、+3</FONT></STRONG><BR><EM>武器（任意），非普通（+1）/珍稀（+2）/极珍稀（+3）</EM><BR>你在用此魔法武器发动的攻击检定和伤害掷骰获得加值。加值的数值取决于武器的稀有度。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
