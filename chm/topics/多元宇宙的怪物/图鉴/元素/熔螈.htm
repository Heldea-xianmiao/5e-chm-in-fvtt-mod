<title>熔螈</title>

html,body { 
	font-family: Arial, Helvetica, sans-serif;

<body><p><font size=5><font color=#800000><STRONG>熔螈 Firenewts</STRONG></font></font></p>
<p>
自火元素位面而来，物质位面的那些温泉与火山地区，往往能找到熔螈的踪迹。这些两栖生物需要栖息于滚烫热水之中，一旦它们远离潮湿与高温的地方一周便会变得无比惫怠。因此，熔螈们会从大地之中探寻热源，并在它们的巢穴之中制造出一条条通道组成的网络，以此让那些滚烫液体流遍整座巢穴。</p><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
