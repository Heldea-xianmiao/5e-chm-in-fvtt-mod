<body><p><font color=#800000><font size=5><strong>暗灵 
Darklings</strong></font></font>
  </p><p>
在古老的传说中，一个喜乐妖精对仲夏女王犯下了背叛的罪行。盛怒之下，女王诅咒了这个叛徒家族的每一个成员。如今他的真名已从历史中被抹去，但故事中叫他 
Dubh Catha（通称“暗鸦”）。其他妖精提到他们的子孙时会用dubh sith——“暗灵”来代指。大多数暗灵都偏好居住在隐蔽的洞穴或者其他种族的城镇角落里。在这些不见光之处，他们悄悄地充当着盗贼和刺客的角色。</p><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
