<body><p><font color=#800000 size=5><strong>鸭嘴龙 Hadrosaurus</strong></font>

鸭嘴龙是一种长着骨状头冠的半四足食草生物。若从孵化开始驯养一只鸭嘴龙，它们就能被训练为一个骑手的优秀载具。</p><p><font color=#800000><strong>鸭嘴龙 Hadrosaurus</strong></font><br><EM>大型野兽（恐龙），无阵营</EM>

<br>

护甲等级：11（天生护甲）<br>

生命值：19（3d10+3）<br>

速度：40尺<BR>力量15（+2） 敏捷10（+0） 体质13（+1）<br>

智力2（-4） 感知10（+0） 魅力5（-3）<br>

技能：察觉+2<br>

感官：被动察觉12<br>

语言：——<br>挑战等级：1/4（50XP） 熟练加值：+2</p>

<P><font color=#800000><strong>动作Actions</strong></font><br>

<strong>扫尾Tail。</strong>近战武器攻击：命中+4，触及5尺，单一目标。命中：7（1d10+2）钝击伤害。</P>

<P></P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
