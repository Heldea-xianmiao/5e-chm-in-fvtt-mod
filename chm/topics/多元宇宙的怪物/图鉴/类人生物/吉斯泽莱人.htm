<P><STRONG><FONT color=#800000 size=5>吉斯泽莱人 Githzerai</FONT></STRONG></P>
<P>吉斯泽莱人是拥有灵能的超凡民族，他们与吉斯洋基人有着共同的起源（也在此书中）。吉斯泽莱人追随着伟大领袖泽伊斯·门尼尔-阿格-吉斯，是一群远离宇宙的苦行僧，他们生活在漂浮于无序的混沌海的堡垒中。他们没有把自己的意志强加给他人，而是专注于控制和操纵他们无尽的可塑家园。</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
