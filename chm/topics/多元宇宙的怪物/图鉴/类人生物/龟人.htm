<P><STRONG><FONT color=#800000 size=5>龟人 Tortles</FONT></STRONG></P>

<P>龟人是杂食性的龟型两足类人生物，龟壳覆盖了他们的大部分身体。由于他们认为龟壳所在即是吾乡，所以龟人对于脚下的土地没有什么眷恋的感情，不会在一地停留很久。<BR>大多数龟人喜欢观察别人是如何生活的。因为把他们现在的伙伴视为家人，一个龟人可能离开故土数十年都不会涌起思乡之情。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
