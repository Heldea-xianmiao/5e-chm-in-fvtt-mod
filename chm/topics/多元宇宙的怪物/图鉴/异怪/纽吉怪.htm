<p><font color=#800000><font size=5><strong>纽吉怪 
Neogi</strong></font></font>
</p><p>
纽吉怪看上去像是大号的蜘蛛，长着鳗鱼一样的脖子和脑袋。这种生物能够毒害目标的身体和心灵，进而制服比它们更强壮的生物。<br>
纽吉怪通常生活在物质位面的偏远角落，比如星界和以太位面。它们抛弃了它们原来的家园去征服和吞并其他世界的生物。在此期间，纽吉怪首先奴役了掘土巨怪。然后，使用它们作为苦力，纽吉怪建造了蜘蛛般的圆滑船只，令它们能够在多元宇宙中遨游。</p><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
