<title>护甲等级</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>

<body>

<P><STRONG><FONT color=#800000 size=5>护甲等级 Armor Class</FONT></STRONG></P>

<P>穿戴护甲或装备盾牌的怪物拥有的护甲等级（AC）等于其护甲、盾牌、以及敏捷属性调整值的总和。如果他们没有这些，怪物的AC将基于其所具有的敏捷调整值与天生护甲（如果有）的总和。</P>

<P>如果一个怪物<STRONG>具有天生护甲</STRONG>、<STRONG>穿戴着护甲</STRONG>、或<STRONG>持有着盾牌</STRONG>，那么其AC后方跟随的括号中将标注上这些内容。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
