<P><STRONG><FONT color=#800000 size=5>平民 Commoners</FONT></STRONG></P>

<P>各种平民包括乡民、农奴、奴隶、仆从、朝圣者、商人、工匠，还有一些普通隐士。</P>

<P><STRONG><FONT color=#800000>平民Commoner</FONT></STRONG><BR><EM>中型类人（任意种族），任意阵营</EM><BR>护甲等级：10<BR>生命值：4（1d8）<BR>速度：30尺<BR>力量10（+0）     

敏捷10（+0）     体质10（+0）<BR>智力10（+0）

魅力10（+0）<BR>感官：被动察觉10<BR>语言：任意一门语言（通常是通用语）<BR>挑战等级：0（10 XP）</P>

<P><STRONG><FONT color=#800000>动作</FONT></STRONG><BR><STRONG>短棍Club。</STRONG>近战武器攻击：命中+2，触及5尺，单一目标。命中：2（1d4）点钝击伤害。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
