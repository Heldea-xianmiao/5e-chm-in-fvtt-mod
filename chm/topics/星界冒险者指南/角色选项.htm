<!DOCTYPE html>

<html>

<head><title>角色选项</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../style.css"></head>

<body>

<H2><FONT color=#000000>第一章:角色选项 Character Options</FONT>    

<HR color=#7147d1>    </H2>

<P>当你为荒宇或星界海的战役或冒险中创建角色时，你可以选择包含本章描述内容在内的任意D&amp;D游戏所提供的选项。一如往常，在创建角色之前，你应和你的DM咨询一下你想选择的选项是否可用。</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../cloud-bridge.js"></script>
</body>

</html>
