<!-- coding: gbk --><!DOCTYPE html>
<html>
<head>
<title>法术页模板</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
html,body { 
	font-family: Arial, Helvetica, sans-serif;
}
h4 {
    color: #704cd9;
    margin-bottom: -20px;
	font-size: 24px;
}
</style>

</head>

<body>
<H4> 法术名｜English</H4>
<P><EM>学派与环阶（仪式；所属、职业、法术、列表）</EM> <BR><STRONG>施法时间：</STRONG> XXX<BR><STRONG>施法距离：</STRONG> 
YYY<BR><STRONG>法术成分：</STRONG>V、S、M（具体成分）<BR><STRONG>持续时间：</STRONG>ZZZ<BR>   
          
    法术描述文</P><script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
