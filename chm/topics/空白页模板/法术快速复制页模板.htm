<script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>

<script>
	function insertStr(str, index, insertStr) {
		return str.substring(0, index)+insertStr+str.substring(index);
	}
	document.querySelectorAll("a").forEach(item=>{
		item.addEventListener('click', event=>{
			event.preventDefault();
			let outerH = event.target.outerHTML;

			outerH = outerH.replace(/style=".*"/, '')

			clip = document.getElementById("clip")
			extra = document.getElementById("extra")
			
			if(extra.value != "") {
				outerH = insertStr(outerH, 2, ' '+extra.value);
			}
			clip.value = outerH;
			clip.select();
			document.execCommand("copy");
			return false;
		})
	})

	const nameFind = document.getElementById("findi")
	nameFind.addEventListener('input', ()=>{
		sStr = nameFind.value.toLowerCase();
		document.querySelectorAll("a").forEach(item=>{
			if (sStr=="" || item.textContent.toLowerCase().includes(sStr)) {
				item.style.display="inline";
				item.nextElementSibling.style.display="inline";
			}
			else {
				item.style.display="none";
				item.nextElementSibling.style.display="none";
			}
		})
	})
</script>
