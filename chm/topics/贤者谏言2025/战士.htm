<!DOCTYPE html>

<head><title>战士</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><link rel="stylesheet" href="../style.css"></head>



<body lang=ZH-CN link=blue vlink="#954f72" style="TEXT-JUSTIFY-TRIM: punctuation">

<P><STRONG><FONT color=#800000>我的战斗大师Battle Master 战士Fighter 引发了敌人的 

借机攻击Opportunity Attack，若该敌人的攻击失手，可以使用 反击Riposte 

战技吗？</FONT></STRONG><BR>可以。只要你还可以执行反应，你就可以在<U>借机攻击</U>没有命中你时使用反击战技。</P>

<P><STRONG><FONT color=#800000>缴械击Disarming Attack 

可以解除生物装备的盾牌吗?<BR></FONT></STRONG>不。缴械击迫使一个生物掉落其持握的物体。而装着的盾牌不仅仅是握在手上而已。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>



</html>
