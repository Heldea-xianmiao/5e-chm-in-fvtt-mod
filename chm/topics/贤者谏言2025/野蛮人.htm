<!DOCTYPE html>
<!-- coding: gbk --><html>

<head><title>野蛮人</title>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><link rel="stylesheet" href="../style.css"></head>



<body lang=ZH-CN link=blue vlink="#954f72" style="TEXT-JUSTIFY-TRIM: punctuation">

<P><STRONG><FONT color=#800000>野蛮人Barbarian 的 鲁莽攻击Reckless Attack 会赋予所有敌人 

优势Adventage，还是只给予你所攻击的目标优势？</FONT></STRONG><BR>如果你使用了野蛮人的鲁莽攻击，直到你下个回合的开始前，所有对你的攻击检定都将具有优势。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>



</html>
