<body><FONT size=3><STRONG><FONT color=#800000>重甲Heavy armor 

会降低敏捷豁免或是属性检定吗？</FONT></STRONG><BR>只要你熟练重甲，它就不会影响你的豁免检定与属性检定（隐匿除外）。

<p class=MsoNormal><FONT size=3><FONT color=#800000><STRONG>用盾牌攻击（</STRONG><STRONG>通常是作为临时武器）</STRONG><STRONG>时，我是否还能受益于它提供的AC<span lang=EN-US>+2的</span>加值？</STRONG></FONT><BR>使用盾牌发动攻击并不会让你失去由它提供的<span 

lang=EN-US>AC</span>加值。</FONT></p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
