<title>圣武士</title>

<body>

<p class=MsoNormal><FONT size=3><STRONG><FONT color=#800000>圣武士Paladin 的 神圣感知Divine Sense 

能感知到有阿斯莫与提夫林吗？毕竟，他们的祖先......</FONT></STRONG><BR>这两个种族均为<U>类人</U>生物，因此无法被神圣感知特性侦测。神圣感知能且只能发现生物类型为<U>天族</U>、<U>邪魔</U>、<U>亡灵</U>的生物。</FONT></p><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
