<p class=MsoNormal> 
 <b><FONT color=#800000 size=3>一名被捆绑了还被塞住嘴的德鲁伊可以直接使用荒野变形挣脱吗？想抓住一名能随意变成老鼠的角色难上加难啊。<BR></FONT>             </b><FONT size=3><U>变形</U>为一个不同的体型也许是一种有效的逃脱手段，但这具体要取决于你是怎样被禁锢或约束的。举个例子，镣铐只能对小型或中型的生物生效，因此德鲁伊变形为微型动物即可从镣铐中脱身，逃脱这一束缚。<BR>不过，改变体型不会自动结束<U>受擒</U>状态和<U>束缚</U>状态，除非改变体型这一行为令你不再满足相应效应的体型要求（若有）。举例来说，<STRONG><U>巨蟹Giant 
Crab</U></STRONG>的钳击只能擒抱住体型不超过中型的生物；如果德鲁伊被一只巨蟹擒抱，变化成一只大型生物就可以逃脱这一擒抱。</FONT></p><script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
