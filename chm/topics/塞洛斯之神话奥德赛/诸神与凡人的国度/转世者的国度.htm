<body>
<P><STRONG><FONT color=#800000 size=5>转世者的国度 Realms of the Returned</FONT></STRONG></P>
<P><EM>“生死为铜币之正反。相对但永不相交。一方永不存于彼方。”</EM></P>
<P align=right>——缚体者司力高斯</P>
<P>在成为神之前，斐纳克曾死亡，坠入了厄睿柏斯的领域，并最终逃离了冥界。他的逃跑路线，斐纳克之路(见冥界冒险)，从那时起就被极少数的人在漫长的时间中使用。这些转世者发现生者的世界与他们活着时经历的世界已经大不相同——已非他们记忆中曾生活的世界。尽管他们已经逃离了冥界，转世者仍然发现自己与生者相异，他们失去了记忆，他们的不自然状态令大多数凡人感到恐惧。结果，大多数转世者遵循特定的行为方式，被称为陵墓——死者之城——的被两座城邦所吸引。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
