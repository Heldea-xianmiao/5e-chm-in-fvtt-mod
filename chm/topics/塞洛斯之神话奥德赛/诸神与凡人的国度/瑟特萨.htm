<P><STRONG><FONT color=#800000 size=5>瑟特萨 Setessa</FONT></STRONG></P>

<P><EM>“这座城市在我曾是孤儿，圄于锁链时拯救了我。现在轮到我来保护它了。”</EM></P>

<P align=right>——卡莉雅斯，欧菲斯塔指挥官</P>

<P>瑟特萨是一座被卡拉美特拉钟爱的城市，它的建筑线条完美融入森林，难以分清内外界限。民众在茂密森林，梯田和瑟特萨驯化的动物间和谐生活，用隆重节日庆祝四季循环。<BR>瑟特萨在塞洛斯诸城邦中也独一无二，城中鲜少有成年居民为男性。女性组成了人口的大部分，担任了几乎所有领袖角色和多数工作。男性少之又少，在城邦中基本是边缘角色。儿童可以自由的在城邦中穿游，他们是最重要的，事实伤瑟特萨人从全塞洛斯收养被遗弃的儿童。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>
