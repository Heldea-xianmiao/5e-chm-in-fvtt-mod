html,body { 
	font-family: Arial, Helvetica, sans-serif;

<body>
<P><STRONG><FONT color=#800000 size=5>维西俄斯山 Mount Vesios</FONT></STRONG></P>
<P>维西俄斯山作为威勒斯山的小妹妹，是一座小一点的火山，不过经常与威勒斯山一起爆发。在它的西坡有一座修道院，居住着研究火山的学者和施法者，他们相信通过维西俄斯山他们能够控制威勒斯山的爆发。许多山灵和阿喀洛斯焰语者会在维西俄斯山顶提供预言。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
