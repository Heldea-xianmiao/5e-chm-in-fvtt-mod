<P><STRONG><FONT color=#800000 size=5>塞壬海 The Siren Sea</FONT></STRONG></P>
<P><EM>「卡莱斐伫立于高处，出神凝望静谧湾岸，<BR>她遵命运之声召唤，来到这片神秘海域。<BR>眼见峭壁迷雾缭绕，耳闻山岩曼语轻歌，<BR>种种异象许下承诺：自己命定非凡荣誉。」</EM></P>
<P align=right>——《卡莱斐纪》</P>
<P>广阔的塞壬海从塞洛斯人已知的陆地向西延伸到世界的边缘。作为塔萨的领域，海洋里隐藏着一大批神奇生物，包括整个屈冬文明。传说中危险包括致命的礁石、流浪岛屿以及掠食者野兽和毁灭性海怪(见第六章)。不断变化的塞壬海中既有绝美景色又存在无穷危险，这正是英雄们传奇奥德赛所发生故事的舞台。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
