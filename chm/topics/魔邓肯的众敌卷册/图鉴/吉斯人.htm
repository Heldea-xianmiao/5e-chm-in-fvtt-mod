<P><STRONG><FONT color=#800000 size=5>吉斯人 Gith</FONT></STRONG></P>
<P>一个早已失去原本名字的古老种族的后裔分裂成两个群体，因各自领袖之间的血仇、志向和阴谋而反目成仇。好战的吉斯洋基人割据了星光位面，且不断掠夺多元宇宙诸世界的魔法和财富。吉斯泽莱人则散居在宇宙的偏僻角落，在漂浮于混沌海的混乱狂潮中的要塞里过着与世隔绝的生活。虽然吉斯人的这两个分支已经彼此相差甚远，但对于夺心魔的仇恨却从未改变，不论吉斯洋基人还是吉斯泽莱人都不会放弃猎杀先祖的仇敌们。</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
