<P><STRONG><FONT color=#800000>深渊行尸ABYSSAL WRETCH<BR></FONT></STRONG><EM>中型邪魔（恶魔），混乱邪恶<BR></EM>AC：11<BR>HP：18  (4d8)<BR>速度：20尺<BR>力量9(-1)  敏捷12(+1) 

体质11(+0)<BR>智力5(-3) 感知8(-1) 魅力5(-3)<BR>伤害抗性：寒冷，火焰，闪电<BR>伤害免疫：毒素<BR>状态免疫：魅惑，恐慌，中毒<BR>感官：黑暗视觉120尺，被动察觉9<BR>语言：理解深渊语但不会说<BR>挑战等级1/4 (50XP)</P>

<P dir=ltr><STRONG><FONT color=#800000>动作Actions</FONT></STRONG><BR><STRONG>啃咬Bite.</STRONG> 

近战武器攻击：命中+3，触及5尺，单一目标。命中：5（1d8+1）穿刺伤害。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>
