<body>
<P><STRONG><FONT color=#800000 size=5>尤格罗斯魔 Yugoloths</FONT></STRONG></P>
<P>雇佣兵们在下层位面和其他位面进行着他们的交易，尤格罗斯魔以效率著称，只有他们对更多财富的渴望才能与之匹敌。虽然尤格罗斯魔不是特别忠诚，而且通常会试图利用契约中的每一个潜在漏洞，但他们承担任何雇佣他们的任务，不管这些任务有多棘手。尤格罗斯魔有各种各样的形态，包括那些在怪物手册中描述的和在这里介绍的六种生物。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
