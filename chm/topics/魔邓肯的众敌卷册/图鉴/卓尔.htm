<P><STRONG><FONT color=#800000 size=5>卓尔 Drow</FONT></STRONG></P>

<P>无论是在幽暗地域（他们的黑暗通道）中，还是在可怕的无底深渊，卓尔都是对地表居民最阴暗的威胁之一。侍奉萝丝的黑暗精灵们不仅要服从她经常自相矛盾的命令，还要生活在对她的怒火的恐惧之下。<BR>通过狡诈、才能、诡计，有些卓尔获得了强大的权势，而弱小的卓尔恐惧他们，侍奉他们。</P>

/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
