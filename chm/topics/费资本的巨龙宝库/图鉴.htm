html,body { 

	font-family: Arial, Helvetica, sans-serif;

<body>

<P><STRONG><FONT color=#800000 size=5>图鉴 Bestiary</FONT></STRONG></P>

<P>在物质位面及其之外，龙类生物的形态极为繁多。本章介绍了宝石龙族，它们是《怪物图鉴》中色彩龙和金属龙的亲族。本章还包括其他的龙类生物，以及与龙类关系密切并经常在其巢穴中出现的生物。<BR>这些怪物按字母顺序排列。关于生物的数据卡的使用方式请参阅《怪物图鉴》的介绍。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
