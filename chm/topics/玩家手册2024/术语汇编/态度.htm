<html>

<title>态度</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

H3{margin-bottom:-18px;

font-size:100%}

</style>

</head>



<body>

<H3 id="Attitude">态度 Attitude</H3><p>怪物对某名玩家角色的初始态度会是以下之一：友好、敌对或冷漠。另见“<STRONG>友好</STRONG>”、“<STRONG>敌对</STRONG>”、“<STRONG>冷漠</STRONG>”以及“<STRONG>影响</STRONG>”。</P>



<H3 id="Friendly">友好 Friendly【态度】</H3><p>友好的生物对你的看法是喜爱的、认可的。你尝试影响一个友好生物时，你进行的属性检定具有优势。另见“<STRONG>影响</STRONG>”。</P>



<H3 id="Hostile">敌对 Hostile【态度】</H3><p>敌对的生物对你的看法是厌恶的、反对的。你尝试影响一个敌对生物时，你进行的属性检定具有劣势。另见“<STRONG>影响</STRONG>”。</P>



<H3 id="Indifferent">冷漠 Indifferent【态度】</H3><p>冷漠的生物没有动机去帮助你，亦没有动机去妨碍你。怪物的默认态度为冷漠。另见“<STRONG>影响</STRONG>”。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
