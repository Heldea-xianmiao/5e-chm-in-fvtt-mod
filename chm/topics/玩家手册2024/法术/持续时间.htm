<!DOCTYPE html>

<html>

<head><title>持续时间</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../style.css"></head>



<body><h2>持续时间 Duration</h2>

<p>法术的持续时间即法术在其经施展后所维持的时长。持续时间通常有以下几种形式：<BR><b>专注Concentration。</b>专注法术依专注规则运行（详见术语汇编）。<BR><b>立即Instantaneous。</b>立即法术意味着其中魔法只存在了一瞬间，随后便消散。<BR><b>持续时间段Time Span。</b>持续法术会给出一个时间段，其单位是轮、分钟、小时或者其他。例如，持续时间为“1分钟”意味着法术会在1分钟后结束。只要你未处于失能状态，你便可以随时结束一个正在持续的、由你所施展的持续法术（无需动作）。</p>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
