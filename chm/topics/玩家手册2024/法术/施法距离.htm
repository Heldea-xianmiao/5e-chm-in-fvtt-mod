<h2>施法距离Range</h2>
<p>法术的施法距离是施法者能将法术效应源点投射的最远距离，且法术的详述中会列出该法术中的哪部分效应受该距离限制。<BR>法术的施法距离通常有以下几种形式：</p>
<UL>
  <LI>
<div><b>距离Distance。</b>法术的施法距离以尺数列出。</div></LI>
  <LI>
<div><b>触碰Touch。</b>法术的效应必须以施法者所接触的某个事物为源点，具体由此法术本身列出。</div></LI>
  <LI>
<div><b>自身Self。</b>法术在施法者自身施展或从施法者自身弥散，具体由此法术本身列出。</div></LI></UL>
<p>若某个法术包含可以移动的效应，则其移动不受施法距离的限制，除非法术本身另有说明。</p>

<script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
