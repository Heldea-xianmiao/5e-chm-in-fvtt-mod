<body>

<H3>豁免检定与伤害 Saving Throw and Damage</H3>

<P>经由豁免检定造成的伤害需要遵循以下规则：</P>

<P><STRONG>对多个目标造成的伤害 Damage Against Multiple Targets<BR></STRONG>当你造成的某个伤害效应迫使两个或者更多目标，需要同时进行豁免检定来与之对抗时，你只需要进行一次掷骰来决定对每个目标造成的伤害。举例来说，当一个法师施展<U><EM>火球术Fire Ball</EM></U>，他只需要为爆发范围内涉及的所有生物掷一次该法术的伤害。</P>

<P><STRONG>伤害减半 Half 

Damage<BR></STRONG>许多豁免效应会在目标成功通过豁免检定时，只对目标造成半伤（向下取整）。减半后的伤害，其数值等于豁免失败时本应造成的伤害的一半。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
