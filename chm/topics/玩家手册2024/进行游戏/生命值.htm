<!DOCTYPE html>
<!-- coding: gbk -->
<html>
<head><title>生命值</title>
<meta content="text/html; charset=UTF-8">
<link rel="stylesheet" href="../../style.css"></head>
<body><h3>生命值 Hit Points</h3>
<p>生命值代表耐久力和生存意志。有更多生命值的生物更难被杀死。你的生命值上限代表你未受伤时拥有的生命值。你的当前生命值可能是从0到上限之间的任何数字，0是生命值的最小值。<BR>每当你受到伤害时，你都需要将伤害值从你的生命值中扣除。除非生命值降到0，否则失去生命值不会对你的行动能力有任何影响。<BR>如果你只有一半或者更少的生命值，那么你会处于浴血，其本身没有游戏上的效果，但可能会触发其他游戏上的效应。</p>

<script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
