<!DOCTYPE html>
<!-- coding: gbk -->

<html>

<head><title>伤害类型</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../style.css"></head>



<body><h3>伤害类型Damage Types</h3>

<p>每种伤害都有自己的伤害类型，比如<b>火焰</b>或者<b>挥砍</b>。伤害类型列于术语汇编，其本身没有任何规则，但是诸如<FONT color=#008000><STRONG>抗性</STRONG></FONT>之类的其他规则会基于伤害类型来运作。</p>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
