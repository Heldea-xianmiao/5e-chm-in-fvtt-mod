<!DOCTYPE html>
<!-- coding: gbk -->

<html>

<head><title>免疫</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../style.css"></head>



<body><h3>免疫 Immunity</h3>

<p>某些生物或者物件会免疫特定的伤害类型或者某类特定的状态。免疫特定伤害类型意味着你不会因该类型的伤害受到伤害，免疫某类状态意味着你不受该类状态的影响。</p>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../cloud-bridge.js"></script>
</body>

</html>
