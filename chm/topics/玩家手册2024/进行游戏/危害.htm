<html>

<head><title>危害</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../style.css"></head>



<body><h3>危害 Hazards</h3>

<p>怪物是角色们需要面对的主要威胁，但是，其他危险也同样不可忽视。术语汇编为下列危害给出了定义：

<TABLE style="WIDTH: 360px; BORDER-COLLAPSE: collapse" 

cellSpacing=0 cellPadding=2 border=0>

<TR><TD><Font color=#008000><Strong>燃烧</Strong></Font></TD><TD><Font color=#008000><Strong>坠落</Strong></Font></TD><TD><Font color=#008000><Strong>窒息</Strong></Font></TD></TR>

<TR><TD><Font color=#008000><Strong>脱水</Strong></Font></TD><TD><Font color=#008000><Strong>饥饿</Strong></Font></TD><TD></TD></TR>

</TABLE></p>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
