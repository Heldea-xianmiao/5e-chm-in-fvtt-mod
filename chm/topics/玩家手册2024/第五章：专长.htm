<h1>第五章：专长 Feats</h1>
<p>本章提供了一系列不与角色职业绑定的特殊特性，这些特性被称为专长。专长代表着角色在某些领域上的天赋与精通，这些天赋与精通为角色带来了不同的特殊能力。专长还象征着职业之外的其他训练、经验和能力。<BR>接下来的内容会为你介绍专长的各个组成部分，并依照不同的分类列举出各种专长选项。<BR>你的背景会给予你一个专长。达到一定等级时，你的职业也会为你提供属性值提升专长，或者也允许你选择另一项你符合条件的专长。<BR>不管你是以什么样的方式获得了专长，你都不能重复选择相同的专长，除非其详述部分有特别允许的说明。</p>

<script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
