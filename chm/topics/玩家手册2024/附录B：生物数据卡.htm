<body><h1>  附录B：生物数据卡 Creature

Stat Blocks</h1>

<p>此附录提供了本书其他地方所提及的生物数据，如职业，装备，及法术章节。见规则术语以获悉如何阅读数据卡。更多的生物详见<b>《怪物图鉴》</b>。</p>

<p>下列生物数据依首字母排序。DM在使用其数据时可以对其细节进行调整。</p>

<p><FONT color=#808080 size=2>译注：根据2025.04.17的errata，此处生物数据卡已被《怪物图鉴2025》的数据卡替换</FONT></p>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
