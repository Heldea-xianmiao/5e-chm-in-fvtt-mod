<!-- coding: gbk --><!DOCTYPE html>

<html>

<head>

<title>纸条模板</title><style>html,body { font-family: Arial, Helvetica, sans-serif;}</style>

<meta name="GENERATOR" content="WinCHM">

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>

html,body { 

	font-family: Arial, Helvetica, sans-serif;

}

</style>



</head>



<body>

<div style="BORDER-TOP: black 1px solid; FONT-FAMILY: 幼圆; BORDER-RIGHT: black 1px solid;BORDER-BOTTOM: black 1px solid; PADDING-BOTTOM: 10px; PADDING-TOP: 10px; PADDING-LEFT: 50px;MARGIN-LEFT: 50px; MARGIN-RIGHT: 50px;BORDER-LEFT: black 1px solid; PADDING-RIGHT: 50px; BACKGROUND-COLOR: #FFF4D1">边栏 </div>

<P> </P>

<div style="HEIGHT: 400px; FONT-FAMILY: 华文楷体; WIDTH: 350px; BACKGROUND-IMAGE: url(./小纸条.jpg); COLOR: #313131; PADDING-BOTTOM: 30px; PADDING-TOP: 30px; PADDING-LEFT: 20px; PADDING-RIGHT: 20px"><p>小纸条</p></div>

<div style="HEIGHT: 900px; FONT-FAMILY: 华文楷体; WIDTH: 350px; BACKGROUND-IMAGE: url(./边栏纸条.jpg); FLOAT: right; COLOR: #313131; PADDING-BOTTOM: 50px; PADDING-TOP: 50px; PADDING-LEFT: 30px; PADDING-RIGHT: 30px"><p>边栏纸条</p></div>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../cloud-bridge.js"></script>
</body>

</html>
