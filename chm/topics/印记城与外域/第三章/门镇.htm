<body>

<H2>门镇 Gate-Towns</H2>

<P>在外域的边缘，均匀地分布着十六座门镇，它们同无极尖峰的距离是相等的。每一座城镇都围绕着一座通往某个外层位面的传送门而建，这些城镇也受到与之相连的领域的显著影响。每一座城镇和它的住民都与其他城镇的大不相同，它们身上会显示出对应位面的许多极端特质。各位面的细节可在《城主指南》中找到。<BR>下文将按英文首字母顺序介绍每座门镇。</P>





<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
