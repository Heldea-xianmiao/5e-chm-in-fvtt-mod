<!DOCTYPE html>

<html>

<head><title>背景</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../style.css">

<style>

h1{color:#971869}

h3{BORDER-BOTTOM: #b79c61 1px solid;MARGIN-BOTTOM:-10px;}

</style>

</head>



<body>

<H2>背景 Backgrounds </H2>

<P>本节为你呈现了两个1级角色的背景选项：<STRONG>门镇守卫Gate 

Warden</STRONG>与<STRONG>位面哲学家Planar 

Philosopher</STRONG>，这些背景选项或与印记城相关，或与外域相关，或与两者皆相关。<BR>如果你选择上述的这些背景，你将获得背景中记述的对应奖励专长。如果你选择的背景并没有给予你专长，你则可以从下述列表中选择并获取一个奖励专长。（这些是出现在《<STRONG><FONT face=仿宋>玩家手册</FONT></STRONG>》中的专长）</P>

<UL>

  <LI><STRONG> 熟习Skilled</STRONG>

  <LI><STRONG>健壮Tough</STRONG> </LI></UL>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
