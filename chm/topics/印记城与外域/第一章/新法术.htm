<body>

<H2>法术 Spells </H2>

<P>法术表格展示了哪些职业可以施展本节陈述的法术，以及这些法术的环阶。本表同样列出了这些法术所属的学派。</P>

<P><STRONG>法术Spells</STRONG>

<TABLE class=center>

<TR bgcolor=#f2ede9><TH width=80>环阶</TH><TH width=200>法术</TH><TH width=80>学派</TH><TH width=200>职业</TH></TR>

<TR><TD>二环</TD><TD><U><EM>侦测扭曲Warp Sense</EM></U> </TD><TD>预言</TD><TD>术士、魔契师、法师</TD></TR>

<TR bgcolor=#f2ede9><TD>四环</TD><TD><U><EM>界门封锁Gate Seal</EM></U> </TD><TD>防护</TD><TD>术士、魔契师、法师</TD></TR>

</TABLE></P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
