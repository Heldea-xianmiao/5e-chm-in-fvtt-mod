<body>

<H1>第二章：印记城「众门之城」Sigil, the City of Doors</H1>

<P> 

  印记城是多元宇宙的十字路口，坐落在巨轮的中心。这座“众门之城”，与所有存在位面及坐落于诸位面之中的无尽世界相连，汇聚了川流不息的商贸、跨越位面的旅行、层出不穷的诡计与永无止境的冒险。印记城通常被称为笼城，因为进出这座城市的唯一途径是通过众多传送门，而这些传送门尽数掌握在神秘的痛苦女士手中。</P>





<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
