<body>

<H2>印记城位于何处？Where is Sigil?</H2>

<P>印记城既存在于巨轮的中心，又处于空无之中。在外域中央，有一座高耸入云的山峰，名曰无极尖峰the Spire，如针一般直指苍穹。印记城漂浮在无极尖峰的顶峰之上，建造在一座巨大石质天环的内侧，自地面仰望仅依稀可辨。试图通过攀爬或飞行进入城市皆是枉然之举，正如试图抵达无极尖峰的顶端一般徒劳无功。</P>





<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
