<body>
<H1>魔蝠 Mephits
</H1>

<p class=sum>恶意肆虐的元素顽徒
</p>

<div class="HT"><STRONG>栖息地：</STRONG>
异界（元素位面）；<STRONG>宝藏：</STRONG>无
</div>

<P>魔蝠栖息于元素位面，是性情顽劣的恶作剧者。最常见的六种魔蝠形似半身人大小的石像鬼，拥有翅膀、夸张的五官、以及由两种元素交织而成的身躯。它们大多自私自利，沉溺于扭曲的幽默感或膨胀的自负，在自己的家园位面恣意妄为。有些魔蝠则充当巨灵或魔法使用者的信使与间谍。
<BR>魔蝠极不情愿离开它们极端元素之力满盈的家园。如若被放逐至物质位面或其他世界，它们便会以恶毒的恶作剧发泄不满，甚至折磨弱小生物取乐。当魔蝠被摧毁时，它们会在一阵元素魔法爆裂中化为乌有。

</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
