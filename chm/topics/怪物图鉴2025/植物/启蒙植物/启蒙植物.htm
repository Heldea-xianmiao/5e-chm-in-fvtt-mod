<body>

<H1>启蒙植物 Awakened Plants

</H1>



<p class=sum>被魔法注入生命的植物

</p>



<div class="HT"><STRONG>栖息地：</STRONG>森林；<STRONG>宝藏：</STRONG>无

</div>



<P>魔法能够赋予移动能力，智慧，乃至声音。诸如启蒙术、或者其他位面存在的影响都可以给平凡的植物带来生命。当然，一些具有非凡特性的植物可能天生就有这些特质。

</P>

<DIV align=center>



<div class=little-paper style="WIDTH: 500px">

<P align=left>我们保护森林，并不意味着它自己毫无防备。

</P>

<P align=right>——皮克精，溪流闪闪

</P></div></DIV>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
