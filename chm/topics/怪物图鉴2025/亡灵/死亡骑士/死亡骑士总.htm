<H1>死亡骑士 Death Knight

</H1>



<p class=sum>不死军团的恐怖统帅

</p>



<div class="HT"><STRONG>栖息地：</STRONG>

任意；<STRONG>宝藏：</STRONG>武备

</div>



<P>死亡骑士乃是邪恶的勇士，身披盔甲的骷髅督军。这些同时身负毁灭性的武艺和亵渎魔法的不死暴君率领着亵渎军团对抗生者，或在被诅咒的堡垒中盘踞。每一名死亡骑士都被过去的悲剧和耻辱缠绕，并最终因此犯下更大的罪行。

</P>

</div>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>
