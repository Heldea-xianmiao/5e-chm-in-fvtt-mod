<body>

<H1>食尸鬼 Ghoul

</H1>



<p class=sum>食尸飱徒

</p>



<div class="HT"><STRONG>栖息地：</STRONG>沼泽，幽暗地域，城市 

；<STRONG>宝藏：</STRONG>任意

</div>



<P>食尸鬼以群体行动，出没在世界各处腐败的角落，如饥似渴地寻找着尸体，以及将要成为尸体的猎物。这些腐尸骨瘦如柴，但是身形矫捷，有着非常长的舌头。它们栖息在各种地下墓穴与废墟之中，喜欢吞吃坟墓里的东西，能用有毒的爪子麻痹敌人。

</P>

<DIV align=center>

<div class=little-paper style="WIDTH: 350px"><P align=left>

尖牙地中邪殿上，秽王饥渴无厌。

<BR>棺材板内尽珍馐，大快朵颐饕餮！

</P>

<P align=right>——对食尸鬼之王多瑞森的祷词</P></div></DIV>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>
