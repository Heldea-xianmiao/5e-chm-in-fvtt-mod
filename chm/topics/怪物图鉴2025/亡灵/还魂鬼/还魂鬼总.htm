<body>

<H1>还魂鬼 Revenants

</H1>



<p class=sum>坟中掘起的复仇亡魂

</p>



<div class="HT"><STRONG>栖息地：</STRONG>森林，沼泽，城市

任意；<STRONG>宝藏：</STRONG>任意

</div>



<P>还魂鬼是一心只想复仇的愤怒恶灵。它们附身于尸体，或是其他载体之上，驾驭这些载体去伸张自己的正义，或是将滔天的怒火向着令其蒙冤之人肆意倾泻。还魂鬼拒绝接受死亡，直到其想要惩戒之人不复存在。即使其载体被摧毁，还魂鬼们也不会停歇——它们会寄宿于新的载体，继续那永无止境的恶灵追猎，直至为仇敌送上命定的审判。

</P>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
