<html>
<head>
<title>啵灵蛙</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>

<body>
<H1>啵灵蛙 Bullywug
</H1>

<p class=sum>沼泽与滩涂中的两栖蛙灵
</p>

<div class="HT"><STRONG>栖息地：</STRONG>沼泽
；<STRONG>宝藏：</STRONG>器具，个体
</div>

<P>啵灵蛙是沼泽地的妖精化身。它们守护着朦胧的野外沼地——并认为自己担任的这一角色广受欢迎。啵灵蛙大小与人类相仿，但却长着蛙类和蟾蜍的形貌；这些蛙人和沼泽地中栖息的生物们同样关系密切。
</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
