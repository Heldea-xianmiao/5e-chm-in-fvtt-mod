<html>

<title>半羊人</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<body>

<H1>半羊人 Satyrs

</H1>



<p class=sum>羊角羊蹄的狂欢者

</p>



<div class="HT"><STRONG>栖息地：</STRONG>森林、异界（妖精荒野）

；<STRONG>宝藏：</STRONG>器具

</div>



<P>半羊人象征着荒野之上那无拘无束的快乐。狂欢之热令他们陶醉——他们宴饮，他们歌舞，他们比武，他们嬉戏。

</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
