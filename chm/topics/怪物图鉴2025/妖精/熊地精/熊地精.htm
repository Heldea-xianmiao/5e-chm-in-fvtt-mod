<title>熊地精</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>

<body>
<H1>熊地精 Bugbears
</H1>

<p class=sum>潜隐伏击的类地精蛮兵
</p>

<div class="HT" style="WIDTH: 600px"><STRONG>栖息地：</STRONG>
森林，草原，异界（妖精荒野），幽暗地域；<STRONG>宝藏：</STRONG>武备，个体
</div>

<P>熊地精代表着对荒野的恐惧和自然地域的威胁。它们以行踪诡秘著称，冒险进入它们领地的敌人通常会消失得无影无踪。
</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
