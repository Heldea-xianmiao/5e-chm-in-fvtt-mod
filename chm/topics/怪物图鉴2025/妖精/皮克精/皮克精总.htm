<body>

<H1>皮克精 Pixies

</H1>



<p class=sum>浩瀚森林的要好朋友

</p>



<div class="HT"><STRONG>栖息地：</STRONG>森林、异界（妖精荒野）

；<STRONG>宝藏：</STRONG>奥秘

</div>



<P>皮克精们不到一尺高，外表像一群小号的，背后长有精巧轻盈翅膀的精灵。他们悄无声息地偷窥那些进入他们林地之家附近的家伙，遇到友好的家伙才会现身。至于那些不友好的家伙嘛，等着被皮克精们恶作剧吧。

</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
