<body>

<H1>幼虫魔 Larvae

</H1>



<p class=sum>堕魂应许之终

</p>



<div class="HT"><STRONG>栖息地：</STRONG>

异界（下层位面）；<STRONG>宝藏：</STRONG>无

</div>



<P>堕入下层位面的灵魂常化为幼虫魔。这些幼虫魔是蛆虫般的可憎存在，扭曲面容依稀残存生前轮廓。这些可怜虫近乎无助，竭力躲避下层位面强大住民的注意。诸多邪魔视其为珍馐，而邪恶施法者则用其进行堕落仪式。<STRONG><U>夜鬼婆Night 

Hag</U></STRONG> 常豢养幼虫魔，跨位面贩卖给多元宇宙的奸恶之徒。

<BR>若在下层位面存活够久，幼虫魔最终会蜕变为其他低阶邪魔。



</P>





<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
