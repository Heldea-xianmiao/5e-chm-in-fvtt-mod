<html>

<head>

<title>原魔</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>



<body>

<H1>原魔 Manes

</H1>



<p class=sum>疯狂与恐慌并存的恶魔

</p>



<div class="HT"><STRONG>栖息地：</STRONG>异界（无底深渊）

；<STRONG>宝藏：</STRONG>无

</div>



<P>当最令人唾弃的灵魂被判入无底深渊时，原魔便诞生了，它是恶魔的最低等形态。这些畸形恶魔有着扭曲的体态与肢干，上面爬满了深渊中的寄生虫。恶魔的冲动与持续的恐惧驱动着原魔，使它们只知道如何造成惊吓与爆发疯狂。

</P>

<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
