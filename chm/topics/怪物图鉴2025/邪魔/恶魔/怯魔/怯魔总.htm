<body>

<H1>怯魔 Dretches

</H1>



<p class=sum>疯狂与粗鄙并存的恶魔

</p>



<div class="HT"><STRONG>栖息地：</STRONG>

异界（无底深渊）；<STRONG>宝藏：</STRONG>无

</div>



<P>怯魔是更强大的恶魔的仆从与牺牲品，有着粗鄙的身形、混乱的冲动，以及暴力的倾向。在无底深渊的深处有着不计其数的怯魔，它们散发着恶臭，组成了庞大的恶魔大军。

</P>



<div class=little-paper style="WIDTH: 537px; MARGIN-LEFT: 24px">

<P>啊！这是无底深渊的无垠奇观。如果你想要找点你不喜欢的东西，在这里就有。

</P>

<P align=right>——贾兰达，深渊中的专家

</P></div>



<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
