<H1>巨魔 Troll
</H1>

<p class=sum>令人厌恶的潜伏再生怪物
</p>

<div class="HT"><STRONG>栖息地：</STRONG>
寒带，森林，丘陵，山地，沼泽，幽暗地域；<STRONG>宝藏：</STRONG>无
</div>

<P>巨魔会悄然爬出巢穴，捕猎比自己小的猎物，再将它们拖回自己腐臭的巢中。这些扭曲的暴徒能够再生伤口，重新长出身体被切断的部位——甚至包括脑袋。巨魔被切断的四肢能够继续移动和攻击。除非用火焰或强酸灼烧，否则巨魔能长好极其严重的伤势，并对那些击败他们的人发起复仇。
<BR>巨魔通常独自狩猎，但偶尔它们也会以小群的形式合作伏击猎物和袭击村落。像鬼婆和山丘巨人之类的生物可能会以恶心的食物作为报酬，说服巨魔为其工作。
</P>

<script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
