<!DOCTYPE html>
<!-- coding: gbk --><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:dt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882" xmlns="http://www.w3.org/TR/REC-html40"><head><meta http-equiv=Content-Type  content="text/html; charset=UTF-8"><meta name=ProgId  content=Word.Document ><meta name=Generator  content="Microsoft Word 14" ><meta name=Originator  content="Microsoft Word 14" ><title>蛇人：半蛇半人</title><style>html,body {font-family: Arial, Helvetica, sans-serif;font-size: 11pt;}</style></head><body style="tab-interval: 21pt"><div class="Section0" ><p><span><STRONG><FONT color=#800000 size=6>蛇人：半蛇半人 Yuan-Ti：Snake People</FONT></STRONG></span></p><p><span>被称为“蛇人”的蛇形生物是古代腐朽的人类帝国的仅剩遗骸。很久以前，他们的黑暗神传授给他们亵渎的食人仪式，将他们的身体和蛇的血肉肉混合在一起，形成了一个以种姓为基础的混血儿社会，其中最像蛇形的是领导者，最像人类的则担任间谍和代理人。</span></p></div><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body></html>
