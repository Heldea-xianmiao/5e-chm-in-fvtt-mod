<BR></FONT></STRONG>这些重型恐龙的后背与尾巴上长着两排骨质的刃板，而它那条灵活的、长有尖刺的长尾巴可以高举迎击食肉动物。他们往往不分年龄，以群体游牧的方式旅行与草原上。

<P><STRONG><FONT color=#800000 >剑龙 Stegosaurus</FONT></STRONG>

<BR><EM>巨型野兽，无阵营</EM><BR>护甲等级：13（天生护甲）<BR>生命值：76（8d12+24）<BR>速度：40尺<BR>力量20（+5） 敏捷9（-1） 体质17（+3）<BR>智力2（-4） 

感知11（+0） 魅力5（-3）<BR>感官：被动察觉10<BR>语言：——<BR>挑战等级：4（1100XP）<BR><STRONG><FONT color=#800000>动作Actions</FONT></STRONG><BR><STRONG>扫尾Tail。</STRONG>近战武器攻击：命中+7，触及10尺，单一目标。命中：26（6d6+5）穿刺伤害。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
