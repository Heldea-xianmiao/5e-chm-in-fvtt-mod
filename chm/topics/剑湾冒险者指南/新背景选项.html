<!-- coding: gbk --><!DOCTYPE html>

<HTML><head>

<title>新背景选项</title>



<META content="text/html; charset=UTF-8" http-equiv=Content-Type>

<META name=GENERATOR content="MSHTML 11.00.10570.1001"></HEAD>

<BODY lang=ZH-CN style="TEXT-JUSTIFY-TRIM: punctuation" vLink=#954f72 link=blue>

<DIV class=WordSection1 style="LAYOUT-GRID:  15.6pt none">

<P class=MsoNormal> </P></DIV><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../cloud-bridge.js"></script>
</body></HTML>
