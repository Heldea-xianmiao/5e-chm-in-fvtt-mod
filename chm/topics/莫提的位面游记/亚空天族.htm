<P><FONT color=#800000><FONT size=5><STRONG>亚空天族 
Archons</STRONG></FONT></FONT>   
</P>
<P>   
亚空天族是天界山的七层天堂的公民。它们自秩序与仁爱的力量中诞生，守卫家园免受邪魔势力的入侵，保护弱者以防邪恶力量的威胁。亚空天族还是专业的交涉者，能够说能够说出多元宇宙中的所有语言。当被卷进战斗时，它们倾向于制服敌人。但当面对邪魔时，亚空天族就会化身为愤怒的战士，展现出天界山的正义之怒，将邪恶之徒彻底击溃。<BR>   
每个亚空天族的形态，都与其在天界等级体系中的地位相对应。在战斗中遭遇敌人时，亚空天族会散发出上层位面的全部怒火，在为盟友提供支援的同时也能威慑敌人。</P><script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
