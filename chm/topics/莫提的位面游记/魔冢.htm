<body>
<P><STRONG><FONT size=5><FONT color=#800000>魔冢Modrons</FONT></FONT></STRONG></P>
<P><SPAN 
style="DISPLAY: inline !important" > 
魔冢是一种部分由机械组成的生物，它们被铸造于机械境位面，遵从着严格的阶级制度。每一个魔冢都恪尽职守地服从来自直接上级的命令，同时也指挥着直接下级，从而将最高秩序典范的意志层层传递到最低阶的一元冢。大部分魔冢都是低阶的<STRONG><EM>基础魔冢base 
modrons</EM></STRONG> 
......</SPAN><FONT color=blue><EM>一元冢</EM></FONT><SPAN 
style="DISPLAY: inline !important" >，</SPAN><EM 
style="WIDOWS: 2" ><FONT color=blue>二元冢</FONT></EM><SPAN 
style="DISPLAY: inline !important" >，</SPAN><EM 
style="WIDOWS: 2" ><FONT color=blue>三元冢</FONT></EM><SPAN 
style="DISPLAY: inline !important" >，</SPAN><EM 
style="WIDOWS: 2" ><FONT color=blue>四元冢</FONT></EM><SPAN 
style="DISPLAY: inline !important" >，</SPAN><EM 
style="WIDOWS: 2" ><FONT color=blue>五元冢</FONT></EM><SPAN 
style="DISPLAY: inline !important" >，而</SPAN><STRONG><EM>高阶魔冢hierarchy 
modron</EM></STRONG><SPAN 
style="DISPLAY: inline !important" >则作为领导者，维护着机械境与该位面之外的秩序。关于魔冢的更多资料，请查阅</SPAN><EM 
style="WIDOWS: 2" ><STRONG>《怪物图鉴》</STRONG></EM><SPAN 
style="DISPLAY: inline !important" >。</SPAN></P><script src="../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
