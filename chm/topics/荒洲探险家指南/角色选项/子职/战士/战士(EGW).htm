<!DOCTYPE html>

<html>

<head><title>战士（EGW）</title>

<meta content="text/html; charset=UTF-8">

<body>

<H2><FONT color=#800000>战士 Figher</FONT></H2>

<P>在荒洲，战士有多种形式，从凭借刀锋力量谋生的饱经风霜的雇佣兵，到为故乡旗帜而战的忠诚士兵，再到以武器技艺为其最大资本的坚韧寻宝者。</P>

<P>在第3级，战士会获得《玩家手册》中描述的武术范型职业特性。回音骑士是该特性的新选择。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../../cloud-bridge.js"></script>
</body>

</html>
