<H1><FONT color=#800000>第一章：荒洲的传说 Story of 

Wildemount</FONT></H1>

<P><EM>太初，有生于无。先生光，后生想，再后色身与火乃生。</EM></P>

<P><EM>自皈依神，当愿众生，体解神谕，发无上心。</EM></P>

<P><EM>自皈依理，当愿众生，行于正道，不落邪见。</EM></P>

<P><EM>自皈依贤，当愿众生，得传经藏，精进无碍。</EM></P>

<P>——阿迪亚·舒，钴魂书院档案员<BR>——Archivist Adia Shu of the Cobalt 

Soul</P>

<P><STRONG>章节封面：</STRONG>一名钴魂武僧为一队年轻的冒险者展现荒洲的过去。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
