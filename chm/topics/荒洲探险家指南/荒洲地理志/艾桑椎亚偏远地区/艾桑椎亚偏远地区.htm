<H2><FONT color=#800000>艾桑椎亚偏远地区 Distant Lands of Exandria</FONT></H2>

<P>荒洲是一片幅员辽阔、饱受战争蹂躏的大陆，艾桑椎亚的许多传说都是伪造的，然而它只是这个生机勃勃的世界中令人印象深刻的多片大陆之一。许多其他区域也在本书中被提及，包括马凯特雄伟的王国，毗邻的塔·多雷以及其他尚未发现的区域。本章节概述了荒洲大陆以外的艾桑椎亚已知地域。<BR></P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>
