<!DOCTYPE html>
<!-- coding: gbk -->
<html>
<head><title>埃格林采石场</title>
<meta content="text/html; charset=UTF-8">
<link rel="stylesheet" href="../../../style.css"></head>
<body>
<H2><FONT color=#800000>埃格林采石场 Egelin Quarry</FONT></H2>
<P> 
  
    
这座拥有数百年历史的露天矿场曾是朱乐斯领建造扎达什时所用石材的主要来源，但在东南方发现了富含铂金的赫雷希斯矿山后，这里基本上被废弃了。如今，仅有一小群矿工仍在这片巨大的裂谷工作，他们收集散落的石料以出售给石匠。在自封为采石场工头的侏儒探矿者拉森·德·维勒的监督下，有许多碎石工人仍在矿场中劳作，他们希望能发现一些隐藏的宝石或贵金属矿石。 </P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
