<H2><FONT color=#800000>石笼崖 Stobecage Cliffs</FONT> </H2>

<P>这片崎岖、几乎无法通行的沿海山脉和断崖环绕着整个荒洲的东北半岛，自两个大陆的文明第一次开始交流之前，石笼崖就已存在并成为了荒洲和塔尔多雷之间的天然屏障。悬崖环绕着茂密而危险的卢什古特森林，这种致命的地形组合使得大部分悬崖地区无法建造城镇或城市。因此，该地区自古以来便是怪物肆虐的荒野。</P>

<P> 

剪切海峡 Shearing Channel&nbsp; 

激荡的海水拍打着高耸的悬崖，数千年的狂风暴雨在悬崖上凿出无数洞穴，里面栖息着可怕的飞行和攀爬生物。据说，只有最勇敢——或是最愚蠢的探险家才会尝试在石笼崖的岩石和潮水中探寻秘密。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
