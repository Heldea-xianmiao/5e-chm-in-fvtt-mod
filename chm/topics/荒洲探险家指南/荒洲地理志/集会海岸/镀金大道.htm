<html>

<head><title>镀金大道</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../../style.css"></head>



<body>

<H2><FONT color=#800000>镀金大道 Gilded Roadway</FONT></H2>

<P>镀金大道几乎贯穿了整个集会海岸，是一条连接克洛维斯联邦每个主要城市的文明纽带。这条交通繁忙的公路过于漫长，不可能不断的巡逻，但有一小队泽里佐铁卫会在城市间移动，至少为旅行者提供一种安全的假象。镀金大道是克洛维斯联邦沿岸城市之间团结的象征，甚至还出现在联邦的官方印章上。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
