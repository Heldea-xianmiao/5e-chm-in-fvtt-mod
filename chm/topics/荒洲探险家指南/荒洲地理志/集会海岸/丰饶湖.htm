<html>
<head><title>丰饶湖</title>
<meta content="text/html; charset=UTF-8">

<body>
<H2><FONT color=#800000>丰饶湖 Copia Lake</FONT>  
 
 
</H2>
<P>  
 
在图索阿以北，波光粼粼的丰饶湖坐落在1000英尺高的西里奥斯山脉的丰饶森林之中。这个湖被视为圣池，基瑙的战士和祭司会登临此地，净化自己免受噩梦和恶灵的困扰。因此，联邦禁止了任何非仪式性的捕鱼或潜水活动。然而，由于湖泊位置偏僻且仅有零星的泽里佐铁卫驻守，这片区域成了走私货物的首选投放点，途径的走私者甚至会通过偷捕湖中特有的圣鱼来赚取额外收入。 
</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
