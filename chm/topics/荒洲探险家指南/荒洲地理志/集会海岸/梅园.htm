<!DOCTYPE html>

<html>

<head><title>梅林</title>

<meta content="text/html; charset=UTF-8">

<link rel="stylesheet" href="../../../style.css"></head>



<body>

<H2><FONT color=#800000>梅林&nbsp;Plumgroves</FONT></H2>

<P>梅林是一片郁郁葱葱的林地，充满了柔软的草地、随微风摇曳的有着白色树皮与紫色花朵的热带树木，以及许多种类的美味且享有盛誉的水果。在整个大陆，再没有任何其他地方有如此丰富的、备受追捧的浆果和水果，费奥林人围绕着这片丰饶的土地确立了他们的身份和生活方式。<BR>当地的法律限制野生动物的狩猎，以确保生态系统的平衡，泽里佐铁卫巡逻在森林小径上，以防止偷猎行为。梅林既美丽又安全，经常可以看到家庭和孩子在公共小道上散步。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
