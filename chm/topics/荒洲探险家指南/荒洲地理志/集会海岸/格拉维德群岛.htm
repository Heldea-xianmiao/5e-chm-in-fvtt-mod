<!DOCTYPE html>
<!-- coding: gbk -->
<html>
<head><title>格拉维德群岛</title>
<meta content="text/html; charset=UTF-8">
<link rel="stylesheet" href="../../../style.css"></head>

<body>
<H2><FONT color=#800000>格拉维德群岛 Gravid 
Archipelago</FONT></H2>
<P>这三个岛屿由陡峭的火山山峰和陡峭的悬崖组成，上面有许多洞穴，里面住着血鹰、鸟妖，传言说甚至有一只大得不可思议的<STRONG><FONT color=#000000>鹏鸟 
roc</FONT></STRONG>。岛上只有零星的树和丛林，因此资源稀缺，很少有船只有正当理由在此停靠。然而，这并不能阻止狂欢众在该地区进行储存、伏击和进行达克托外的会面。</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
