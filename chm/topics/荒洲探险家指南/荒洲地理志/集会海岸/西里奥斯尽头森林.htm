<head><title>西里奥斯尽头森林</title>

<body>

<H2><FONT color=#800000>西里奥斯尽头森林 Cyrios End 

Forest</FONT></H2>

<P>在西里奥斯山脉的南部边缘，是一片覆盖着针叶林和丛林植被的茂密林地。西里奥斯尽头森林提供用于制作优质纸张的木材，但采伐者通常只在外围活动。在错综复杂的小径和布满蕨类植物的地面深处，致命的生物在阴影中狩猎，而围绕着一座倒塌神庙的废弃的小屋和木屋则已崩塌，那座神庙如今大部分已被森林重新吞噬。冒险家和历史学家曾带领探险队进入这个基瑙村庄和神庙遗迹，但他们经常受伤或染病归来，甚至有些人根本没有回来。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
