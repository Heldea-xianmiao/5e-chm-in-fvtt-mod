<body>

<H2><FONT color=#800000>炉星山脉 Hearthstar Peaks</FONT></H2>

<P> 

 

即使从海洋上也能看到炉星山脉，它是达马里港附近一个紧凑的、高得令人眩晕的山脉群。最高的山峰，被称为炉星峰，其上燃烧着一根巨大的永燃奥术火焰柱。炉星是一个灯塔，它警示着附近的船只小心该地区的崎岖且险恶岩石海岸，引导他们朝东航行至半岛尽头的边缘点灯塔，最终驶向达马里港的安全港口。攀登这些山峰的陡峭斜坡极为危险，但仍有些人喜欢挑战，偶尔也会传出关于一些奥术师会漂浮到最高的山峰，在最顶层的洞穴中藏匿他们的秘密。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>

</html>
