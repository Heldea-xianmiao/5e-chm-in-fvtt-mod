(4d4 + 12)<BR>速度：0尺，飞行30尺（悬浮）<BR>力量 10（+0）敏捷 16（+3）体质 16（+3）<BR>智力 13（+1）感知

<P><STRONG><FONT color=#800000>动作Actions</FONT></STRONG><BR><STRONG>啃咬Bite。</STRONG>近战武器攻击：命中+5，触及5尺，单一目标。命中：5（1d4 

+ 3）点穿刺伤害。<BR></P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
