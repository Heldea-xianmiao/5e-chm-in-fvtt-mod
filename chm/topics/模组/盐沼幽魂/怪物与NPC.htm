<body>

<H1>怪物与NPC</H1>

<P>本附录中详细介绍了本书中出现，但《<FONT face=仿宋><STRONG>怪物图鉴</STRONG></FONT>》并未收录的生物，而资料面板的解读也记录在怪物图鉴中。其中一些也在《<FONT face=仿宋><STRONG>湮灭之墓</STRONG></FONT>》、《<FONT face=仿宋><STRONG>瓦罗的怪物指南</STRONG></FONT>》或《<FONT face=仿宋><STRONG>毁灭亲王</STRONG></FONT>》中出现，但仍在此处列出以方便查找。<BR>附录中生物按首字母顺序排列。 

</P>





<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>



</html>
