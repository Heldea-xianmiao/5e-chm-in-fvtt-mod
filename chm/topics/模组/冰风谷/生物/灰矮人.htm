<P><STRONG><FONT color=#800000 size=5>灰矮人Duergar</FONT></STRONG></P>

<P>灰矮人是居住在幽暗地域和其他没有太阳的国度深处的矮人。他们的心灵能力归功于很久以前奴役他们的灵吸怪。灰矮人最终挣脱了灵吸怪主人的魔爪，但却永远被转化了，获得了力量，但同时也获得了悲伤。这种阴郁导致一些灰矮人更显化其阴郁的意面，而另一些则表现出暴力的意面。<BR><STRONG>地狱的主人。</STRONG>阿斯蒙蒂斯，九狱之主，模仿灰矮人之神来培养已经堕落的灰矮人们心中的邪恶。他为他们提供了神圣的指引，并向他们的敌人复仇，同时敦促他们采取残暴的行为，同时一直隐藏自己的身份。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
