<P><STRONG><FONT color=#800000 size=5>歌利亚 Goliath</FONT></STRONG></P>

<P>在最高峰的山坡上，远远高于树木生长的高度，空气稀薄，寒风呼啸，住着隐居的哥利亚人。很少有人能如实讲述自己遇见歌利亚的经历，能与歌利亚建立友谊者更是少之又少。<BR>歌利亚喜欢竞争和计算分数，记录他们的事迹，统计他们的成就，以便与别人的功绩相比较。歌利亚热衷于胜利，但他们同样把失败看作是提高自己技能的动力。最重要的是，每一个歌利亚都在追求着超越他们过去的表现，由此承担了更高的风险。因此，很少有歌利亚能活到老年。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
<script src="../../../../cloud-bridge.js"></script>
</body>

</html>
