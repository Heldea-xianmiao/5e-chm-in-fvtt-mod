<P><STRONG><FONT color=#800000 size=5>魔卫 Magen</FONT></STRONG></P>
<P>魔卫是由一道法师法术(见附录D中的法术<EM><FONT color=#800080>创造魔卫creat 
magen</FONT></EM>)或其他奥艺之技所创造的魔法的、类人型的存在。<BR>尽管魔卫看起来像是人类，但它们实际上是构装生物。当一位魔卫受伤时，其伤口流出的鲜血有着如水银一般都色泽与浓度。它们完完全全地依靠魔法生存。当一位卫士被杀死时，它的身体会在一道无害的火焰爆发与一阵迅速消散的烟云中消失。<BR><STRONG>魔法仆役Magical 
Servant。</STRONG>魔卫是理想的仆役。当魔卫被创造出来时，它们全都具有保护自己与其造主的本能，并且他们会毫不犹豫地执行其造主的任何指示。当它们完成一项任务时，它们会安静地停于原地，等待着它们的主人给予下一道指令。</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
