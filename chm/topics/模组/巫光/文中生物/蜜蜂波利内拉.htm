<P><STRONG><FONT color=#800000>蜜蜂波利内拉 Pollenella The 
Honeybee</FONT></STRONG><BR><EM>微型野兽，无阵营<BR></EM>护甲等级：13<BR>生命值：1（1d4-1）<BR>速度：5 
尺，飞行 30 尺<BR>力量 1（-5）敏捷 16（+3）体质 8（-1）<BR>智力 1（-5）感知 10（+0）魅力 1（-5）<BR>感官：被动察觉

<P><STRONG><FONT color=#800000>动作Actions</FONT></STRONG><BR><STRONG>针刺 
Sting。</STRONG>近战武器攻击：命中+5，触及 5 尺，单一目标。命中：3 穿刺伤害</P><script src="../../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
