<html>
<head>
<title>魔法物品-世界吊床</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
html,body { 
	font-family: Arial, Helvetica, sans-serif;
}
</style>

</head>

<body>
<P><STRONG><FONT color=#800000>世界吊床Hammock of 
Worlds</FONT></STRONG><BR>世界吊床是一款色彩缤纷的吊床，采用传统的阿塔瓜设计编织而成。 
其功能如同一个<STRONG><EM>诸界之井Well of Many Worlds</EM></STRONG> 
，但有两处不同：</P>
<UL>
  <LI>它只能由被称为“翠绿医者”的组织的成员使用。 
  <LI>它创建的传送门只能连接到妖精荒野的<STRONG>幽灵兰花台地Ghost Orchid 
  Tepui</STRONG>或遥远国度的<STRONG>干旱长老Drought 
  Elder</STRONG>      
  （由使用者选择）——这两个位面与阿塔瓜相连。</LI></UL> 
  <P>银貘修道院的任何翠绿医者成员都可以使用<STRONG>世界吊床Hammock of 
Worlds</STRONG>      
  。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
