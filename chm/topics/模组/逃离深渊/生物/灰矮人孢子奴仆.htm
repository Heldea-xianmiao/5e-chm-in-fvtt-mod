<P><STRONG><FONT color=#800000>灰矮人孢子奴仆 Duergar Spore 

Servant</FONT></STRONG><BR><EM>中型植物，无阵营</EM><BR>AC 16（鳞甲，盾牌）<BR>HP 

26（4d8+8）<BR>速度 15尺<BR>力量14（+2） 敏捷11（+0） 体质14（+2）<BR>智力2（-4） 感知6（-2） 

魅力1（-5）<BR>伤害抗性 毒素<BR>状态免疫 目盲，魅惑，恐慌，麻痹<BR>感官 盲视 30尺（超过该范围视为目盲），被动察觉 8<BR>语言 

无<BR>挑战等级 1/2（100XP）</P>

<P><STRONG><FONT color=#800000>动作<BR></FONT>战镐（War 

Pick）。</STRONG>近战武器攻击：命中+4，触及5尺，单一目标。命中：6（1d8+2）穿刺伤害。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
