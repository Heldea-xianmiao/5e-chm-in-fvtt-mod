<P><STRONG><FONT color=#800000>恐爪怪孢子奴仆 Hook Horror Spore 

Servant</FONT></STRONG><BR><EM>中型植物，无阵营</EM><BR>AC 15（天生护甲）<BR>HP 

75（10d10+20）<BR>速度 20尺，攀爬 20尺<BR>力量18（+4） 敏捷10（+0） 体质15（+2）<BR>智力2（-4） 感知6（-2） 

魅力1（-5）<BR>状态免疫 目盲，魅惑，恐慌，麻痹<BR>感官 盲视 30尺（超过该范围视为目盲），被动察觉 8<BR>语言 无<BR>挑战等级

<P><STRONG><FONT color=#800000>动作</FONT></STRONG><BR><STRONG>多重攻击（Multiattack）。</STRONG>孢子奴仆进行两次钩爪攻击。<BR><STRONG>钩爪（Hook）。</STRONG>近战武器攻击：命中+6，触及10尺，单一目标。命中：11（2d6+4）穿刺伤害。</P><script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 报告导航位置 (用于书签记忆)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 监听引用操作 (Alt + 选中文本)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
