<html>

<title>魔法物品</title>

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
html,body { 
	font-family: Arial, Helvetica, sans-serif;
}

<body>
<P><STRONG><FONT color=#800000 size=4>凛冬暗蚀 Winter's Dark 
Bite</FONT></STRONG><BR><EM>武器(巨剑)，非普通<BR></EM>角色们可能从特里斯坦爵士手中得到这把剑，它是由来自一种颠倒世界的未知金属锻造而成。在通常情况下，它是一把+1巨剑。但是当它被用来对付<STRONG><FONT color=#ff0000>特萨尔蛇蜥Thessahydra</FONT></STRONG>的时候，它是一把+3巨剑。当在<STRONG>颠倒世界</STRONG>时，它是一把+4巨剑。</P><script src="../../../cloud-bridge.js"></script>
<script>
/* 5e-chm-bridge */
(function(){
    const post = (type, data) => {
        try { window.parent.postMessage({ type: '5echm:'+type, ...data }, '*'); } catch(e){}
    };
    
    // 1. 鎶ュ憡瀵艰埅浣嶇疆 (鐢ㄤ簬涔︾璁板繂)
    post('nav', { href: window.location.href, title: document.title });

    // 2. 鐩戝惉寮曠敤鎿嶄綔 (Alt + 閫変腑鏂囨湰)
    document.addEventListener('mouseup', (ev) => {
        const isAction = ev.altKey || ev.ctrlKey;
        if (!isAction) return;

        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return;

        let html = "";
        try {
            if (sel.rangeCount > 0) {
                const div = document.createElement("div");
                for (let i=0; i<sel.rangeCount; i++) div.appendChild(sel.getRangeAt(i).cloneContents());
                html = div.innerHTML;
            }
        } catch(e) {}

        if (html || sel.toString()) {
            post('quote', { 
                html: html || sel.toString(), 
                text: sel.toString(), 
                title: document.title 
            });
        }
    });
})();
</script>
</body>
</html>
